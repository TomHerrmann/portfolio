<script>
var APP_VERSION = "2";
// Problems part 1: arrays, two pointers, sliding window, stack, binary search, linked list
var PROBLEMS = (typeof PROBLEMS !== 'undefined' ? PROBLEMS : []).concat([
{
  id: 'two-sum', t: 'Two Sum', p: 'hashing', d: 'E', fn: 'twoSum', params: 'nums, target',
  prompt: `Given an array of integers \`nums\` and an integer \`target\`, return the **indices** of the two numbers that add up to \`target\`. Exactly one answer exists and you may not use the same element twice. Return the indices in increasing order.

**Example:** \`nums = [2,7,11,15], target = 9\` → \`[0,1]\``,
  tests: [[[[2,7,11,15],9],[0,1]], [[[3,2,4],6],[1,2]], [[[3,3],6],[0,1]], [[[-1,-2,-3,-4,-5],-8],[2,4]]],
  hints: ['The brute force checks every pair: O(n²). What would you need to look up to do it in one pass?', 'For each number x you need to know: have I already seen target - x? A hash map answers that in O(1).', 'Store value → index as you go. Check before inserting so you never pair an element with itself.'],
  sol: `function twoSum(nums, target) {
  const seen = new Map(); // value -> index
  for (let i = 0; i < nums.length; i++) {
    const need = target - nums[i];
    if (seen.has(need)) return [seen.get(need), i];
    seen.set(nums[i], i);
  }
  return [];
}`,
  why: `**Pattern:** complement lookup. Whenever a problem says "find two things that combine to X", ask what the *partner* of the current item must be, then keep a set/map of what you have seen.

**Time** O(n), **space** O(n). Mention the sorted + two-pointer alternative (O(n log n), O(1) extra) but note sorting loses original indices.`
},
{
  id: 'group-anagrams', t: 'Group Anagrams', p: 'hashing', d: 'M', fn: 'groupAnagrams', params: 'strs', cmp: 'sortAll',
  prompt: `Group the strings that are anagrams of each other. Return the groups in any order.

**Example:** \`["eat","tea","tan","ate","nat","bat"]\` → \`[["bat"],["nat","tan"],["ate","eat","tea"]]\``,
  tests: [[[["eat","tea","tan","ate","nat","bat"]],[["bat"],["nat","tan"],["ate","eat","tea"]]], [[[""]],[[""]]], [[["a"]],[["a"]]], [[["abc","bca","xyz","zyx","q"]],[["abc","bca"],["xyz","zyx"],["q"]]]],
  hints: ['Anagrams share something identical once you normalize them. What normal form can you compute for each word?', 'Sorted letters is a valid key (O(k log k)). A 26-length count array joined into a string is O(k).', 'Map from key → list of words; return the map values.'],
  sol: `function groupAnagrams(strs) {
  const groups = new Map();
  for (const s of strs) {
    const count = new Array(26).fill(0);
    for (const ch of s) count[ch.charCodeAt(0) - 97]++;
    const key = count.join('#');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  return [...groups.values()];
}`,
  why: `**Pattern:** canonical key. Turn each item into a signature that is equal for items you want grouped, then bucket by it.

**Time** O(n·k) with the count key (O(n·k log k) with sorting), **space** O(n·k). Join with a separator so counts like [1,11] and [11,1] can't collide.`
},
{
  id: 'top-k-frequent', t: 'Top K Frequent Elements', p: 'hashing', d: 'M', fn: 'topKFrequent', params: 'nums, k', cmp: 'sortOuter',
  prompt: `Return the \`k\` most frequent elements, in any order. The answer is unique.

**Example:** \`nums = [1,1,1,2,2,3], k = 2\` → \`[1,2]\`

Can you beat O(n log n)?`,
  tests: [[[[1,1,1,2,2,3],2],[1,2]], [[[1],1],[1]], [[[4,4,4,5,5,6,6,6,6],2],[4,6]], [[[-1,-1,2],1],[-1]]],
  hints: ['First count frequencies with a map.', 'Sorting by frequency is O(n log n). A heap of size k is O(n log k).', 'Bucket sort: a frequency can be at most n, so make buckets[freq] = list of numbers, then walk from the top bucket down.'],
  sol: `function topKFrequent(nums, k) {
  const freq = new Map();
  for (const n of nums) freq.set(n, (freq.get(n) || 0) + 1);
  const buckets = Array.from({ length: nums.length + 1 }, () => []);
  for (const [n, f] of freq) buckets[f].push(n);
  const out = [];
  for (let f = buckets.length - 1; f > 0 && out.length < k; f--) {
    for (const n of buckets[f]) {
      out.push(n);
      if (out.length === k) break;
    }
  }
  return out;
}`,
  why: `**Pattern:** count, then bucket. When the value you sort by is bounded (frequency ≤ n), bucket sort gives O(n).

**Time** O(n), **space** O(n). In the interview, say the heap version too: it's the answer if k is tiny and n is a stream.`
},
{
  id: 'product-except-self', t: 'Product of Array Except Self', p: 'prefix', d: 'M', fn: 'productExceptSelf', params: 'nums',
  prompt: `Return an array where \`out[i]\` is the product of every element except \`nums[i]\`. Do it in O(n) **without division**.

**Example:** \`[1,2,3,4]\` → \`[24,12,8,6]\``,
  tests: [[[[1,2,3,4]],[24,12,8,6]], [[[-1,1,0,-3,3]],[0,0,9,0,0]], [[[2,3]],[3,2]], [[[5,1,1,1]],[1,5,5,5]]],
  hints: ['out[i] = (product of everything left of i) × (product of everything right of i).', 'Compute left products in one pass, right products in a second pass going backwards.', 'You can reuse the output array for left products and keep the right product in a single variable.'],
  sol: `function productExceptSelf(nums) {
  const n = nums.length;
  const out = new Array(n).fill(1);
  let left = 1;
  for (let i = 0; i < n; i++) { out[i] = left; left *= nums[i]; }
  let right = 1;
  for (let i = n - 1; i >= 0; i--) { out[i] *= right; right *= nums[i]; }
  return out.map(x => x === 0 ? 0 : x); // normalize -0
}`,
  why: `**Pattern:** prefix and suffix products. Same idea as prefix sums: precompute an aggregate from each side.

**Time** O(n), **space** O(1) extra (output doesn't count). The \`-0\` normalization is a JS quirk worth knowing: \`-1 * 0 === -0\`.`
},
{
  id: 'longest-consecutive', t: 'Longest Consecutive Sequence', p: 'hashing', d: 'M', fn: 'longestConsecutive', params: 'nums',
  prompt: `Given an unsorted array, return the length of the longest run of consecutive integers (e.g. 1,2,3,4). Must be O(n).

**Example:** \`[100,4,200,1,3,2]\` → \`4\``,
  tests: [[[[100,4,200,1,3,2]],4], [[[0,3,7,2,5,8,4,6,0,1]],9], [[[]],0], [[[1,2,0,1]],3], [[[9,-1,-2,10]],2]],
  hints: ['Sorting is O(n log n). Put everything in a Set instead.', 'Only start counting from a number that is the *start* of a run, meaning n-1 is not in the set.', 'From each start, walk n+1, n+2… Each number is visited at most twice overall.'],
  sol: `function longestConsecutive(nums) {
  const set = new Set(nums);
  let best = 0;
  for (const n of set) {
    if (set.has(n - 1)) continue; // not a run start
    let len = 1;
    while (set.has(n + len)) len++;
    best = Math.max(best, len);
  }
  return best;
}`,
  why: `**Pattern:** set membership + "only start at the beginning". The skip check is what makes it O(n) instead of O(n²).

**Time** O(n), **space** O(n).`
},
{
  id: 'valid-palindrome', t: 'Valid Palindrome', p: 'two-pointers', d: 'E', fn: 'isPalindrome', params: 's',
  prompt: `Return true if \`s\` reads the same forwards and backwards after lowercasing and removing all non-alphanumeric characters.

**Example:** \`"A man, a plan, a canal: Panama"\` → \`true\``,
  tests: [[["A man, a plan, a canal: Panama"],true], [["race a car"],false], [[" "],true], [["0P"],false], [["ab_a"],true]],
  hints: ['Put one pointer at each end.', 'Skip characters that are not letters or digits, then compare lowercase versions.'],
  sol: `function isPalindrome(s) {
  const ok = c => /[a-z0-9]/i.test(c);
  let l = 0, r = s.length - 1;
  while (l < r) {
    while (l < r && !ok(s[l])) l++;
    while (l < r && !ok(s[r])) r--;
    if (s[l].toLowerCase() !== s[r].toLowerCase()) return false;
    l++; r--;
  }
  return true;
}`,

Most system design rounds fail on **pacing**, not knowledge: 20 minutes on requirements, or diving into Kafka partitions before there's a working design. A fixed sequence keeps you moving and shows the interviewer you can drive.

## The sequence
| Step | Time | Output |
|---|---|---|
| 1. Functional requirements | ~3 min | 3 bullet "users can…" lines |
| 2. Non-functional requirements | ~3 min | 3–5 qualities with numbers |
| 3. Core entities | ~2 min | The nouns you'll store |
| 4. API (or interface) | ~5 min | One endpoint per functional requirement |
| 5. High-level design | ~10–15 min | Boxes and arrows that satisfy every functional requirement |
| 6. Deep dives | ~10–15 min | Make it meet the non-functionals; this is where seniority shows |

Optional between 4 and 5: a **data flow** sketch for pipeline-style problems (crawler, aggregator).

## 1. Functional requirements
Write them as "Users should be able to…". Pick the **top 3**. Explicitly park the rest as "out of scope" so you look decisive, not ignorant.

## 2. Non-functional requirements
Quantify and tie to the product. Not "it should be scalable", but:
- "Reads ≫ writes, ~100:1"
- "Feed loads in < 200 ms p99"
- "Booking must never double-sell a seat (strong consistency there); browsing can be eventually consistent"
- "100M DAU, peak 10× average"

Useful checklist: **CAP choice per feature, latency, scale/throughput, durability, availability target, security/privacy, read/write ratio, geographic distribution.**

## Back-of-envelope: only when it changes a decision
Don't do math for its own sake. Do it when it tells you whether something fits in memory, needs sharding, or needs a CDN. Say "I'll estimate when it matters" and move on.

## 3. Core entities
Just names first (User, Event, Ticket, Booking). Fields come later when you need them.

## 4. API
REST by default. One endpoint per functional requirement. Take the user from the **auth token**, never from the request body.
\`\`\`
POST /bookings        { ticketIds }  -> Booking
GET  /events/:id      -> Event & venue & tickets
GET  /search?term=&date=  -> Event[]
\`\`\`
Mention when you'd use WebSockets/SSE (real-time push) or GraphQL (many clients needing different shapes).

## 5. High-level design
Go requirement by requirement. For each: draw client → API gateway/LB → service → database, and name what's in the DB. Keep it **simple and correct** first. Say "this has a problem at scale; I'll come back to it" and keep moving.

Return to each non-functional requirement and show how the design meets it. Common ones:
- Scaling reads → cache, read replicas, CDN, denormalization
- Scaling writes → sharding, queues, batching
- Consistency/contention → transactions, locks, optimistic concurrency
- Real-time → WebSockets/SSE + pub/sub
- Failure → retries + idempotency, DLQs, replication, multi-AZ

**Senior signal:** you proactively pick the deep dives (2–3) instead of waiting to be asked, and you state trade-offs: "This costs X, buys Y; given our NFR of Z I'd choose it."

- "The simplest thing that works is… The problem with it is… so…"
- "Two options here: A and B. A is simpler; B handles the 10× peak. I'd go with B because…"

  id: 'request-path', name: 'Foundations: what happens when you hit "Send"',
  body: `## TL;DR
A system design diagram is just a map of the journey a request takes from a user's device to the place where data lives, and back again.

## Why start here
Every other concept (caching, scaling, queues) is a tweak to one step of this journey. If the journey is clear, the boxes and arrows in an interview stop being abstract.

## The journey, step by step
1. **Client.** The program the user is touching: a browser, an iPhone app, another company's server. It *starts* requests.
2. **DNS lookup.** Computers find each other by numeric **IP addresses** (like a phone number). DNS is the internet's phone book that turns \`api.example.com\` into an IP address. The answer is cached so this step is usually skipped.
3. **The network trip.** The request travels over the internet using **TCP** (a protocol that guarantees bytes arrive in order and complete) wrapped in **TLS** (encryption, the "S" in HTTPS). Distance matters: light in fiber takes ~70 ms to cross the US and back.
4. **Load balancer.** A front door that receives every request and hands it to one of many identical servers behind it. (See [Load balancing](#/sd/concept/load-balancing).)
5. **Application server** (also "service" or "backend"). A program running on a machine that contains your business logic: "check the password", "build the feed". It's where your code runs.
6. **Data stores.** The app server asks a **database** (durable storage on disk, survives restarts) and maybe a **cache** (fast copy in memory) for the data it needs.
7. **The response** travels back the same way, and the client renders it.

## Key terms
- **Server**: a computer (usually a rented virtual machine or container in a cloud data center) that waits for requests and answers them.
- **Request / response**: one message asking for something, one message answering. In web systems this is usually **HTTP**, with a method (GET read, POST create, PUT/PATCH update, DELETE remove), a path (\`/users/42\`), headers (metadata like auth tokens) and an optional body (JSON data).
- **API** (Application Programming Interface): the list of requests a server agrees to answer and what each returns. "Design the API" means "list the endpoints and their inputs/outputs".
- **Endpoint**: one entry in that list, e.g. \`POST /bookings\`.
- **Latency**: how long one request takes, end to end. Measured in milliseconds.
- **Throughput**: how many requests the system handles per second (**QPS**/**RPS**: queries/requests per second).
- **p50 / p99**: percentiles. "p99 latency is 200 ms" means 99% of requests finish within 200 ms; the slowest 1% take longer. Interviewers care about p99 because that's what unhappy users feel.

## How to use this in an interview
When you draw the high-level design, literally narrate this path for each feature: "The client calls POST /bookings, the load balancer routes it to a Booking Service instance, which opens a transaction in Postgres…" It sounds simple, but it keeps you concrete and the interviewer can follow every step.

  id: 'scaling', name: 'Scaling: what it means, vertical vs horizontal, stateless',
  body: `## TL;DR
**Scaling** is changing a system so it keeps working well (fast and available) when it has to handle more: more users, more requests per second, or more data.

## Why it matters
A design that works for 100 users can fall over at 10 million. Something runs out first: CPU (the processor is 100% busy), memory (RAM is full), disk space, disk speed, or network bandwidth. That first thing to run out is called the **bottleneck**. Scaling is the practice of finding the bottleneck and removing it, then finding the next one.

Scaling is about two different "mores":
- **More load**: more requests per second (throughput). A server can only process so many at once.
- **More data**: more bytes stored than one machine's disk or memory holds.

## Option 1: vertical scaling ("scale up")
Replace the machine with a bigger one: more CPU cores, more RAM, faster disks.
- **Pros:** no code changes. Everything stays on one machine, so there's no coordination between machines.
- **Cons:** there's a ceiling (the biggest machine you can rent), cost rises steeply near the top, and it's still **one machine**, so if it dies, everything is down. That's called a **single point of failure** (SPOF).

## Option 2: horizontal scaling ("scale out")
Add more machines of the same size and spread the work across them.
- **Pros:** practically no ceiling; if one machine dies, the others keep serving (redundancy); you can add or remove machines as traffic changes (**autoscaling**).
- **Cons:** you now need something to spread the work (a **load balancer**), and the machines must be able to answer *any* request, which leads to the stateless idea.

## What "stateless" means
**State** is information a server remembers between requests: who is logged in, what's in a shopping cart, a file a user uploaded, a WebSocket connection.

- A **stateful** server keeps that information in its own memory or disk. If Alice's cart lives in server A's memory, her next request *must* go to server A. If server A restarts, the cart is gone. You can't freely add/remove servers or send requests anywhere.
- A **stateless** server keeps nothing between requests. Every request carries (or points to) everything needed, and any shared data lives *outside* the server: in a database, a cache like Redis, or object storage like S3.

Analogy: a stateless server is a bank teller who looks up your account in the central system every time, so any teller can help you. A stateful server is a teller who keeps your account in their own notebook, so you must always wait in their line.

**Result:** stateless app servers are interchangeable. The load balancer can send each request to whichever is least busy, autoscaling can add or kill machines at will, and a crash loses nothing. This is why the standard design is **stateless services + stateful data stores**.

## But the data stores still have state
Making app servers stateless moves the hard problem to the databases. Scaling *those* uses different tools, covered in their own pages:
- Too many reads → **caching** and **read replicas** (copies of the database).
- Too much data or too many writes → **sharding** (splitting the data across machines).

## Trade-offs
- Vertical first is often correct. One big Postgres server handles far more than people expect. Premature horizontal scaling adds complexity for no benefit.
- Horizontal is required for high availability (no single point of failure) even when load is low.

## Say it like this in the interview
"The API servers are stateless, so they sit behind a load balancer and autoscale on CPU or request rate. Session data lives in Redis and files in S3. The database is the real scaling concern; at our numbers a single primary with read replicas is enough, and I'd shard by user_id only if writes outgrow one machine."

## Related
[Load balancing](#/sd/concept/load-balancing) · [Caching](#/sd/concept/caching) · [Replication](#/sd/concept/replication) · [Partitioning / sharding](#/sd/concept/sharding) · [Foundations](#/sd/concept/request-path)`

  id: 'load-balancing', name: 'Load balancing',
  body: `## TL;DR
A **load balancer** (LB) is a server that sits in front of a group of identical servers and decides which one handles each incoming request.

## Why it matters
Horizontal scaling only works if traffic is spread out. The LB also hides individual servers from clients: clients talk to one address, and servers can be added, removed or replaced behind it.

## How it works
1. Clients send requests to the LB's address.
2. The LB keeps a list of healthy backend servers. It finds out who is healthy with **health checks**: it pings each server (e.g. \`GET /health\`) every few seconds and stops sending traffic to any that fail.
3. For each request, it picks a server using an algorithm and forwards the request.

## Algorithms
- **Round robin**: take turns: A, B, C, A, B, C. Simple; assumes all requests cost the same.
- **Least connections**: send to the server currently handling the fewest requests. Better when some requests are slow.
- **Hash-based** (e.g. hash of user id or IP): the same user always goes to the same server. Useful when a server caches per-user data or holds that user's WebSocket. See [Consistent hashing](#/sd/concept/consistent-hashing).

## Layer 4 vs Layer 7 (network layers)
- **L4** LBs look only at network-level info (IP address and port). Very fast, but can't route by URL.
- **L7** LBs understand HTTP. They can route \`/api/*\` to one group and \`/images/*\` to another, read headers and cookies, and terminate TLS (decrypt HTTPS once at the edge).

## Key terms
- **Sticky sessions**: the LB pins a user to one server (via a cookie). Needed for stateful servers; avoid when possible because a server crash then hurts those users.
- **API gateway**: an L7 entry point with extra features: authentication, rate limiting, request routing to different microservices. Often drawn as the same box as the LB.
- **Reverse proxy**: general term for a server that receives requests on behalf of backend servers (an LB is one kind).

## Say it like this in the interview
You usually just draw it and say one line: "Client → API gateway / load balancer → stateless service instances." Go deeper only for long-lived connections (WebSockets), where you'd mention L4 or hash-based routing so a user's connection stays put.

## Related
[Scaling](#/sd/concept/scaling) · [Consistent hashing](#/sd/concept/consistent-hashing) · [Real-time updates](#/sd/concept/realtime)`

  id: 'consistent-hashing', name: 'Consistent hashing',
  body: `## TL;DR
**Consistent hashing** is a way to assign keys (like user ids) to servers so that adding or removing a server only moves a small fraction of keys, instead of almost all of them.

## The problem it solves
The obvious approach is \`server = hash(key) % N\` where N is the number of servers. A **hash function** turns any input into a big, evenly spread number, so keys spread evenly. But when N changes from 4 to 5, \`% N\` gives a different answer for about 80% of keys. For a cache, that means 80% misses at once; for a database, moving 80% of the data.

## How it works
1. Imagine a circle of numbers (the "ring"), e.g. 0 to 2³²−1.
2. Hash each **server** onto a point on the ring.
3. Hash each **key** onto the ring and walk clockwise; the first server you meet owns that key.
4. Add a server: it takes over only the keys between it and the previous server. Everyone else is untouched. Remove one: only its keys move to the next server.

**Virtual nodes:** each physical server is placed on the ring many times (say 100 points). This spreads load evenly and, when a server leaves, its keys spread across many servers instead of dumping onto one neighbor.

## Where you'll mention it
Distributed caches (which cache node holds this key?), sharded databases (DynamoDB and Cassandra use it internally), routing WebSocket users to connection servers, and load balancers that want the same user on the same server.

## Related
[Partitioning / sharding](#/sd/concept/sharding) · [Caching](#/sd/concept/caching) · [Load balancing](#/sd/concept/load-balancing)`

  id: 'databases', name: 'Databases: SQL vs NoSQL, transactions, data modeling',
  body: `## TL;DR
A **database** is a program that stores data durably (it survives crashes and restarts) and lets you query it efficiently; choosing one is about matching its strengths to how your data is shaped and accessed.

## Relational (SQL) databases
Examples: PostgreSQL, MySQL.
- Data lives in **tables** with rows and columns, and a fixed **schema** (the declared columns and types).
- Tables reference each other with **foreign keys** (a booking row stores the user_id of its user). **Joins** combine related rows in one query.
- **SQL** is the query language: \`SELECT * FROM bookings WHERE user_id = 42\`.
- Strong support for **transactions**.

## What a transaction is (and ACID)
A **transaction** groups several reads/writes so they behave like one all-or-nothing operation. Moving $10 from A to B is two writes; a transaction guarantees you never end up with only one of them applied.

ACID describes the guarantees:
- **Atomicity**: all of it happens or none of it does.
- **Consistency**: the database's rules (constraints like "balance ≥ 0", "email is unique") are never violated.
- **Isolation**: concurrent transactions don't see each other's half-finished work. (There are levels; stricter ones are safer but slower.)
- **Durability**: once it says "committed", the data survives a crash (it's been written to disk / a log).

## NoSQL databases
"Not only SQL": a family of stores that give up some relational features for scale or flexibility.
- **Key-value** (Redis, DynamoDB): look up a value by its key, extremely fast.
- **Wide-column** (Cassandra, DynamoDB tables with sort keys): rows grouped by a **partition key**, sorted by a **sort key** inside the partition. Great for "latest 50 messages in chat X".
- **Document** (MongoDB): store JSON-like documents with flexible fields.
- **Graph** (Neo4j): nodes and edges for relationship-heavy queries.

They typically scale writes horizontally out of the box, but joins are limited or absent and you must design tables around the exact queries you'll run.

## How to choose
- Default to **Postgres**: relational data, need for transactions, flexible future queries. It scales much further than its reputation (vertical scaling, read replicas, partitioning).
- Pick **DynamoDB/Cassandra** when you have enormous write volume, simple key-based access patterns known up front, and can live without joins.
- Interviewers mostly want a justified choice, not a specific answer.

## Data modeling in an interview
1. List your core entities (User, Event, Ticket).
2. For each, the few fields that matter and the **primary key** (the unique id of a row).
3. Note the relationships (one event has many tickets).
4. Note the main queries and the **indexes** needed to make them fast (next page).

## Related
[Database indexes](#/sd/concept/indexing) · [Replication](#/sd/concept/replication) · [Partitioning / sharding](#/sd/concept/sharding) · [Consistency, availability and CAP](#/sd/concept/consistency) · [Contention](#/sd/concept/contention)`
},
{
  id: 'indexing', name: 'Database indexes',
  body: `## TL;DR
An **index** is an extra data structure the database maintains so it can find rows matching a condition without reading the whole table, like the index at the back of a book.

## Why it matters
Without an index, \`WHERE email = 'a@b.com'\` makes the database read every row (a **full table scan**): fine for 1,000 rows, terrible for 1 billion. With an index it's a handful of reads.

## How it works
- **B-tree index** (the default in Postgres/MySQL): a sorted, balanced tree of the indexed column's values, each pointing to its row. Finding a value takes O(log n) steps. Because it's sorted, it also serves range queries (\`created_at > yesterday\`) and ORDER BY.
- **Composite index** on (a, b): sorted by a, then by b within each a. Serves queries on \`a\` or \`a AND b\`, but not on \`b\` alone (like a phone book sorted by last name then first name can't find all "Toms").
- **Hash index**: exact-match only, very fast.
- **Inverted index**: maps each word → documents containing it. Powers full-text search (Elasticsearch).
- **Geospatial index**: finds points near a location (geohash, R-tree, PostGIS).

## The cost
Every index must be updated on every insert/update, so indexes make **writes slower** and use extra storage. Index the columns you actually filter or sort by.

## LSM trees (why some databases write so fast)
Cassandra, RocksDB and DynamoDB's storage use **log-structured merge trees**: writes go to memory and an append-only log, then get flushed to sorted files on disk and merged ("compacted") in the background. Appending is much faster than updating a B-tree in place, at the cost of reads sometimes checking several files.

## Say it like this in the interview
"Tickets table with an index on (event_id, status) so 'available seats for this event' is a fast index lookup instead of a scan."

## Related
[Databases](#/sd/concept/databases) · [Search and location queries](#/sd/concept/search)`
},
{
  id: 'caching', name: 'Caching',
  body: `## TL;DR
A **cache** is a small, fast storage layer that keeps copies of frequently used data so you don't have to fetch or compute it from the slower original source every time.

## Why it matters
Reading from memory takes microseconds; a database query that hits disk or does real work takes milliseconds or more. If 1,000 users load the same popular event page, computing it once and serving 999 copies from a cache saves the database and makes the page fast.

## Key terms
- **Cache hit**: the data was in the cache. **Cache miss**: it wasn't, so you go to the source.
- **Hit rate**: the share of requests that are hits. 95%+ is typical for a good cache.
- **TTL** (time to live): how long an entry stays before it's considered expired.
- **Eviction**: removing entries when the cache is full. **LRU** (least recently used) evicts whatever hasn't been touched longest; **LFU** evicts the least frequently used.
- **Stale data**: the cache holds an old copy after the source changed.
- **Invalidation**: removing or updating cached copies when the source changes. Famously one of the hardest problems in computing.

## Where caches live (closest to the user first)
1. **Browser cache**: the user's own device keeps files, controlled by HTTP headers like \`Cache-Control\`.
2. **CDN**: servers around the world keep copies of static files and media near users (see [Large files](#/sd/concept/blobs)).
3. **Application memory**: a variable/map inside the server process. Fastest, but each server has its own copy and it's lost on restart.
4. **Distributed cache** (Redis, Memcached): a separate shared in-memory server all app servers use. The usual "cache" box in diagrams.
5. The database itself caches hot pages in memory.

## Caching strategies
- **Cache-aside** (most common): the app checks the cache; on a miss it reads the database, then stores the result in the cache with a TTL. On writes, the app updates the database and **deletes** the cached entry so the next read refills it.
- **Write-through**: every write goes to the cache and the database together. Cache is always fresh; writes are slower.
- **Write-behind** (write-back): write to the cache now, flush to the database later. Very fast writes; risk of losing data if the cache dies.

## Classic problems and fixes
- **Stale reads**: use short TTLs and delete-on-write. Delete rather than update, because two concurrent updates can land in the wrong order.
- **Cache stampede** (thundering herd): a very popular key expires and thousands of requests miss at once and all hit the database. Fixes: let only one request rebuild it while others wait (**request coalescing**), refresh popular keys in the background before they expire, add random **jitter** to TTLs so keys don't all expire together.
- **Hot key**: one key gets so much traffic that the single cache server holding it is overwhelmed. Fixes: keep a tiny copy in each app server's memory, or store copies under several keys (\`key#1…key#5\`) and read a random one.

## Say it like this in the interview
Always state four things: **what** you cache, the **key**, the **TTL**, and **how it's invalidated**. "Cache the rendered event page in Redis keyed by event_id with a 60-second TTL; booking changes delete the key."

## Related
[Scaling](#/sd/concept/scaling) · [Consistency, availability and CAP](#/sd/concept/consistency) · [Large files](#/sd/concept/blobs) · [Partitioning / sharding](#/sd/concept/sharding)`
},
{
  id: 'replication', name: 'Replication',
  body: `## TL;DR
**Replication** means keeping copies of the same data on multiple machines so you can survive a machine dying and serve more reads.

## Why it matters
- **Durability & availability**: if the only copy's disk dies, data is gone and the app is down. With replicas, another machine takes over.
- **Read scaling**: reads can be spread across copies.
- **Latency**: copies in other regions are closer to users there.

## Leader–follower (the common setup)
Also called primary–replica or master–slave.
- One **leader** accepts all writes.
- The leader streams its changes to **followers** (read replicas), which apply them.
- Reads can go to followers. If the leader dies, a follower is promoted (**failover**).

## Synchronous vs asynchronous replication
- **Synchronous**: the leader waits until a follower confirms before saying "done". No data loss on failover, but every write is slower, and a slow follower slows everything.
- **Asynchronous**: the leader says "done" immediately and ships changes in the background. Fast, but followers are slightly behind.

**Replication lag** is that "slightly behind". It causes a classic bug: a user updates their profile (goes to the leader), then reloads (reads from a follower that hasn't caught up) and sees the old value. Fix with **read-your-writes**: send a user's reads to the leader for a few seconds after they write, or have the client show its own optimistic update.

## Other setups (name-level knowledge)
- **Multi-leader**: several leaders (e.g. one per region) accept writes; conflicts must be resolved (last write wins, or merge rules).
- **Leaderless** (Cassandra, DynamoDB): write to several replicas and read from several; if write count W + read count R > total copies N, a read is guaranteed to see the latest write (a **quorum**).

## Related
[Consistency, availability and CAP](#/sd/concept/consistency) · [Partitioning / sharding](#/sd/concept/sharding) · [Reliability, availability and observability](#/sd/concept/observability)`

{
  id: 'sharding', name: 'Partitioning / sharding',
  body: `## TL;DR
**Sharding** (or partitioning) splits one dataset across several machines, each holding a subset of the rows, so no single machine has to store or write everything.

## Why it matters
Replication copies *all* data to each machine, so it doesn't help when the data is too big for one machine or when writes are too many for one leader. Sharding divides the data itself.

## Key terms
- **Shard**: one of the pieces (and the machine(s) holding it). Each shard usually has its own replicas too.
- **Shard key / partition key**: the field used to decide which shard a row lives on (e.g. user_id).
- **Hot shard / hot partition**: one shard gets far more traffic than the rest.
- **Cross-shard query**: a query that needs data from several shards; slower and more complex.

## How rows are assigned
- **Hash-based**: shard = hash(key) → spreads evenly. Can't do efficient range queries across keys. Use consistent hashing so adding shards moves little data.
- **Range-based**: users A–M on shard 1, N–Z on shard 2, or by date. Great for range scans, but ranges can get uneven (all of "today's" writes land on one shard).
- **Directory-based**: a lookup table says where each key lives. Flexible, but it's one more thing to query and keep available.

## Choosing a shard key (the important part)
Pick the key so **the most common queries touch exactly one shard** and load spreads evenly.
- Chat messages → conversation_id (a conversation's messages are read together).
- Orders → customer_id (a customer views their orders).
- Bad: a key with a few values (country), or one where one value is huge (a celebrity's user_id for likes).

## Fixing hot shards
Add a random suffix to hot keys (\`post123#0\`…\`post123#9\`) to spread writes over 10 shards, and combine the pieces when reading.

## Say it like this in the interview
Don't shard by reflex. Do the math: if one Postgres primary can handle your writes and data size, say so. Shard when numbers demand it, and justify the key: "Shard messages by conversation_id, since nearly every query is 'messages in this conversation'."

## Related
[Consistent hashing](#/sd/concept/consistent-hashing) · [Replication](#/sd/concept/replication) · [Databases](#/sd/concept/databases)`
},
{
  id: 'consistency', name: 'Consistency, availability and CAP',
  body: `## TL;DR
**Consistency** asks "does every reader see the latest write?", and in a distributed system you sometimes have to choose between always showing the latest data and always answering at all.

## Some background
Once data is replicated across machines, copies can briefly disagree (replication lag). Also, networks fail: machines can be running but unable to reach each other. That's a **network partition**.

## CAP theorem in plain words
During a network partition, a system must pick one:
- **Consistency (C)**: refuse or delay some requests so no one reads stale data.
- **Availability (A)**: keep answering every request, even if some answers are stale.
(P, partition tolerance, isn't optional: networks do fail.)

So in practice CAP is "when things break, do we prefer correct or responsive?"

## Choose per feature, not per system
- Needs **strong consistency** (correct over available): booking the last seat, money balances, inventory, unique usernames, revoking access.
- Fine with **eventual consistency** (available over correct; copies converge within seconds): like counts, view counts, feeds, search results, profile pictures.

## Consistency levels you can name
- **Strong / linearizable**: every read sees the most recent write, as if there were one copy.
- **Eventual**: if writes stop, all copies eventually agree. Reads in between may be stale.
- **Read-your-writes**: you always see your own changes, even if others see them later.
- **Monotonic reads**: you never see data go "back in time" between two reads.

## Say it like this in the interview
Put it in your non-functional requirements, per feature: "Strong consistency for seat booking so we never double-sell; eventual consistency is fine for event search and the seat map display." Then show how the design delivers it (a transaction on one primary for bookings; cache and search index for browsing).

## Related
[Replication](#/sd/concept/replication) · [Contention](#/sd/concept/contention) · [Databases](#/sd/concept/databases)`
},
{
  id: 'queues', name: 'Queues, streams and async processing',
  body: `## TL;DR
A **message queue** is a buffer between two parts of a system: one side drops work items in, the other side takes them out and processes them at its own pace.

## Synchronous vs asynchronous
- **Synchronous**: the caller waits for the answer ("charge the card, tell me if it worked").
- **Asynchronous**: the caller hands off the work and moves on ("send this welcome email eventually"). The user gets a fast response; the work happens in the background.

## Why add a queue
- **Absorb spikes**: 50,000 requests arrive in one second; workers chew through them over a minute instead of crashing.
- **Decouple**: the producer doesn't need the consumer to be up right now; if the email service is down for 5 minutes, messages wait.
- **Retry**: failed work goes back on the queue instead of being lost.
- **Fan-out**: one event ("order placed") can be consumed by several services (email, analytics, warehouse).

## Key terms
- **Producer**: puts messages in. **Consumer** (or worker): takes them out and processes them.
- **Acknowledge (ack)**: the consumer tells the queue "done, delete it". If it crashes before acking, the message is redelivered.
- **At-least-once delivery**: every message is delivered, but possibly more than once (after a crash before the ack). This is the normal guarantee, which is why consumers must be **idempotent** (see [Idempotency](#/sd/concept/idempotency)).
- **Dead-letter queue (DLQ)**: where messages go after failing N times, so one bad message ("poison pill") doesn't block everything. Someone inspects them later.
- **Backpressure**: slowing producers down when consumers can't keep up.
- **Consumer lag**: how far behind consumers are; the key metric to monitor and autoscale on.

## Queue vs log/stream
- **Queue** (SQS, RabbitMQ): each message goes to one consumer and is deleted after ack. Think "to-do list for workers".
- **Log / stream** (Kafka, Kinesis): messages are appended to an ordered log and **kept** for days. Multiple independent consumer groups each read the whole log at their own position, and can re-read (**replay**) history. Think "a shared ledger of everything that happened". Order is guaranteed only within a **partition** (one slice of the log), so you pick a partition key like user_id.

## The outbox pattern
Problem: you save an order to the database and then publish "order placed" to Kafka. If the app crashes between the two, the event is lost. Fix: in the **same database transaction**, also insert the event into an "outbox" table; a separate process reads the outbox and publishes. Now either both happen or neither.

## When not to use one
When the user needs the result right now and the work is quick (e.g. loading their profile). Queues add delay and moving parts.

## Related
[Idempotency and retries](#/sd/concept/idempotency) · [Real-time updates](#/sd/concept/realtime) · [Reliability, availability and observability](#/sd/concept/observability)`
},
{
  id: 'realtime', name: 'Real-time updates: polling, SSE, WebSockets',
  body: `## TL;DR
Real-time features need the **server to tell the client** something happened, but HTTP was designed for the client to ask; these techniques work around that.

## The options, from simplest
- **Short polling**: the client asks every N seconds, "anything new?" Simple, but wasteful and delayed by up to N seconds. Fine for "is my export ready?"
- **Long polling**: the client asks, and the server holds the request open until there's news (or ~30 s pass), then the client immediately asks again. Near real-time over plain HTTP.
- **Server-Sent Events (SSE)**: the client opens one HTTP connection and the server keeps sending events down it. One direction only (server → client), auto-reconnects. Great for feeds, notifications, live scores, streaming LLM tokens.
- **WebSockets**: an HTTP connection is "upgraded" into a persistent two-way channel. Both sides can send any time with little overhead. Needed for chat, multiplayer games, collaborative editing, live bidding.
- **WebRTC**: peer-to-peer connections between browsers, mostly for audio/video calls.

## The real interview question: the server side
With WebSockets or SSE, each user is connected to **one** of many servers. When Bob sends Alice a message, Bob's request lands on server 3, but Alice's connection is on server 7. How does it get there?
1. **Pub/sub** (publish/subscribe): every connection server subscribes to channels for the users or rooms it has connected (Redis pub/sub, Kafka). Server 3 *publishes* "message for Alice" to Alice's channel; server 7, *subscribed* to it, receives it and pushes it down Alice's socket.
2. **Connection registry**: a shared map (in Redis) of user → server. Server 3 looks up Alice → server 7 and forwards directly.

## Other things to mention
- Long-lived connections are stateful, so the load balancer must keep them pinned and you need to handle **reconnects** (e.g. after a deploy, every client reconnects at once; add random delay, "jitter").
- Clients that were offline need to **catch up**: on reconnect, send "last message id I saw" and fetch what was missed from the database.
- **Presence** ("online now"): clients send heartbeats; a key in Redis with a short TTL expires if they stop.

## Related
[Queues, streams and async processing](#/sd/concept/queues) · [Load balancing](#/sd/concept/load-balancing) · [Scaling](#/sd/concept/scaling)`
},
{
  id: 'idempotency', name: 'Idempotency and retries',
  body: `## TL;DR
An operation is **idempotent** if doing it twice has the same effect as doing it once, which makes it safe to retry.

## Why it matters
Networks fail in an ugly way: a request can succeed on the server, but the response gets lost. The client sees a timeout and doesn't know whether it worked. The safe thing is to retry, but a retried "charge $50" charges twice. Queues cause the same problem: at-least-once delivery can hand the same message to a worker twice.

## Examples
- Idempotent: "set status to PAID", "delete item 7", "set balance to 100", HTTP PUT and DELETE (by convention).
- Not idempotent: "add $10 to balance", "create a new order", HTTP POST.

## Making a non-idempotent operation safe: idempotency keys
1. The client generates a unique id for the *intent* (e.g. a UUID when the user taps "Pay") and sends it with the request, often as an \`Idempotency-Key\` header.
2. The server records key → result in a table with a **unique constraint** on the key.
3. If the same key arrives again, the server returns the saved result instead of doing the work again.
Stripe's API works exactly like this.

## Retries done right
- Retry only errors that might succeed next time (timeouts, 503 "service unavailable"), not "invalid card" (400s).
- **Exponential backoff**: wait 100 ms, 200 ms, 400 ms… so you don't hammer a struggling service.
- **Jitter**: add randomness to waits so thousands of clients don't retry in lockstep.
- Cap the number of attempts.
- **Circuit breaker**: if a dependency keeps failing, stop calling it for a while (fail fast) and let it recover.

## "Exactly once"
Truly exactly-once delivery isn't achievable over unreliable networks. The practical recipe is **at-least-once delivery + idempotent processing = exactly-once effect**. Say it that way in interviews.

## Related
[Queues, streams and async processing](#/sd/concept/queues) · [Contention](#/sd/concept/contention) · [Reliability, availability and observability](#/sd/concept/observability)`
},
{
  id: 'contention', name: 'Contention: two users, one seat',
  body: `## TL;DR
**Contention** is when multiple requests try to change the same thing at the same time, and the system must make sure only one wins correctly.

## The bug you're preventing (a race condition)
Two people click "book seat 12A" at the same instant:
1. Request A reads seat 12A: available.
2. Request B reads seat 12A: available.
3. A writes "booked by A". B writes "booked by B".
Both got a confirmation. That's a **race condition**: the outcome depends on timing, and here it's wrong.

## Fixes, simplest first
1. **Pessimistic locking (row lock)**: inside a transaction, \`SELECT … FOR UPDATE\` locks the row; B's transaction waits until A commits, then sees "booked" and fails cleanly. Simple and correct; locks must be short.
2. **Optimistic concurrency control (OCC)**: no lock. Each row has a **version** number. Update with a condition: \`UPDATE seats SET status='booked', version=6 WHERE id='12A' AND version=5\`. If someone else changed it first, zero rows update; you retry or report "taken". Best when conflicts are rare.
3. **Atomic conditional write**: same idea in one statement, \`UPDATE … WHERE status='available'\`. DynamoDB calls these condition expressions.
4. **Reservation with expiry**: for holds that last minutes (checkout), mark the seat "held until 12:10" or use a Redis lock with a **TTL** (SET key NX EX 600: set only if not exists, expire in 600 s). The expiry guarantees release if the user walks away.
5. **Serialize through a queue**: send all actions for a hot item (one auction) through one worker in order. No conflicts by design, at the cost of throughput per item.

## Key terms
- **Lock**: permission held by one actor to modify something; others wait.
- **Deadlock**: two transactions each wait on a lock the other holds. Databases detect and abort one.
- **Distributed lock**: a lock shared across machines (Redis, ZooKeeper). Needs a TTL so a crashed holder doesn't block forever.
- **Isolation level**: how strictly a database separates concurrent transactions. Postgres defaults to Read Committed; Serializable is strictest.

## Say it like this in the interview
Name the unit of contention ("a seat"), the mechanism ("conditional update in a transaction"), what the loser sees ("seat taken, here are nearby seats"), and how holds expire.

## Related
[Databases](#/sd/concept/databases) · [Consistency, availability and CAP](#/sd/concept/consistency) · [Idempotency and retries](#/sd/concept/idempotency)`
},
{
  id: 'blobs', name: 'Large files: blob storage, presigned URLs, CDNs',
  body: `## TL;DR
Big files (images, video, documents) go in **object storage** like Amazon S3, not in your database or through your app servers, and users fetch them via a **CDN** close to them.

## Key terms
- **Blob** (binary large object): any file treated as an opaque chunk of bytes.
- **Object storage** (S3, Google Cloud Storage): a service storing files under keys (\`videos/123/raw.mp4\`). Practically unlimited, cheap, extremely durable. Not a filesystem or a database.
- **Metadata**: facts about the file (owner, size, name, status, its S3 key). Lives in your database.
- **Presigned URL**: a temporary URL your server creates that lets *one* client upload or download *one* specific object directly to/from S3 for a few minutes, without having S3 credentials.
- **Multipart upload**: splitting a large file into parts (e.g. 10 MB each) uploaded in parallel and retried individually; the upload can resume after a dropped connection.
- **CDN** (content delivery network): a worldwide network of cache servers ("edge locations"). The first user in Tokyo fetches a file from your origin; later Tokyo users get it from the nearby edge. Lower latency, far less load on your servers.

## The standard flow
**Upload**
1. Client: "I want to upload a 2 GB video." → your API.
2. API creates a metadata row (status: uploading) and returns presigned URL(s).
3. Client uploads **directly to S3**, in parts.
4. S3 notifies your system when done (an event) → mark status ready, start processing (thumbnails, transcoding, virus scan) via a queue.

**Download**
Client asks your API for the file → API checks permissions → returns a CDN URL (signed if private) → bytes come from the CDN.

## Why not send files through your servers?
They'd spend their memory, CPU and bandwidth just shuttling bytes, and a 2 GB upload would tie up a server for minutes. S3 and CDNs are built for exactly this.

## Related
[Caching](#/sd/concept/caching) · [Queues, streams and async processing](#/sd/concept/queues)`
},
{
  id: 'search', name: 'Search and location queries',
  body: `## Full-text search
**Problem:** "find events whose name contains 'taylor'" with \`LIKE '%taylor%'\` scans every row; it doesn't handle typos, word forms or relevance ranking.

**Inverted index:** like a book's index: for each word, the list of documents containing it. Searching "taylor swift" = look up both words' lists and intersect. Search engines (**Elasticsearch / OpenSearch**) build these, plus ranking by relevance, typo tolerance (fuzzy matching) and filters.

**Keeping it in sync:** the database stays the **source of truth** (the authoritative copy). Changes flow to the search index through **CDC** (change data capture: a process reads the database's internal change log and forwards each change). The index is a few seconds behind, which is fine for search.

For modest scale, Postgres has built-in full-text search and trigram indexes; mention it as the simpler option.

## Location ("near me") queries
**Problem:** "drivers within 2 km" can't be done efficiently with a normal index on latitude and longitude separately.

- **Geohash**: encode a lat/long into a string where nearby places share a prefix (e.g. \`dr5ru\` covers a few blocks of Manhattan). "Nearby" becomes "same prefix", which a normal index handles.
- **Quadtree**: recursively split the map into 4 squares until each square has few points. Dense cities get small squares; oceans stay big.
- **Tools**: Redis GEO commands (great for constantly moving drivers because it's in memory), PostGIS for Postgres, Elasticsearch geo queries.

## Typeahead
Precompute, for each prefix ("ta", "tay"…), the top suggestions, and serve them from memory. See the [Typeahead walkthrough](#/sd/walk/typeahead).

## Related
[Database indexes](#/sd/concept/indexing) · [Databases](#/sd/concept/databases)`
},
{
  id: 'auth', name: 'Authentication, sessions and tokens',
  body: `## Two different questions
- **Authentication (authn)**: *who are you?* Proving identity (password, passkey, Google sign-in).
- **Authorization (authz)**: *what are you allowed to do?* Checking permissions (can this user see this account?).

## After login: remembering who you are
HTTP doesn't remember anything between requests, so after a successful login the server gives the client something to send with every later request.

**Option 1: sessions (opaque ids)**
- Server creates a random **session id**, stores session data (user id, expiry) in a store like Redis, and sends the id in a **cookie**.
- Each request: look up the id → know the user.
- **Pros:** easy to revoke (delete the session). **Cons:** a lookup on every request.

**Option 2: tokens (JWT)**
- A **JWT** (JSON Web Token) is a small JSON payload (user id, expiry, permissions) **signed** by the server's private key. Anyone with the public key can verify it wasn't tampered with, *without* a database lookup.
- **Pros:** fast, stateless verification at any service. **Cons:** hard to revoke before it expires.
- The usual fix: short-lived **access tokens** (5–15 minutes) + a long-lived **refresh token** used to get new access tokens. Refresh tokens are stored server-side and can be revoked.
- **Refresh token rotation**: each use returns a new refresh token and invalidates the old one. If an old one is ever reused, someone stole it → revoke the whole chain.

## Cookies, and where tokens live in a browser
- A **cookie** is a small value the browser stores and automatically sends to the site.
- **httpOnly** cookies can't be read by JavaScript, so a malicious injected script (**XSS**, cross-site scripting) can't steal them. Prefer them over localStorage for tokens.
- **Secure**: only sent over HTTPS. **SameSite**: limits sending the cookie on requests started by other sites, which defends against **CSRF** (cross-site request forgery: another site tricking your browser into making a request to your bank).

## OAuth 2.0 and OIDC
- **OAuth 2.0**: a standard for letting an app act on your behalf at another service without giving it your password ("Allow this app to read your calendar?"). The app gets an access token with limited **scopes** (permissions).
- **Authorization Code flow + PKCE**: the secure flow for browser and mobile apps. PKCE adds a one-time secret so an intercepted code is useless.
- **OIDC** (OpenID Connect): a layer on OAuth that adds an **ID token** saying who the user is. "Sign in with Google" is OIDC.

## Passkeys / WebAuthn
Instead of a password, the device creates a **public/private key pair** for the site. The private key never leaves the device (protected by Face ID). To log in, the server sends a random challenge, the device signs it, the server checks with the public key. Phishing-resistant because keys are tied to the real website's domain.

## MFA
Multi-factor authentication: something you know (password) + something you have (phone code, passkey) or are (biometrics).

## Authorization models
- **RBAC** (role-based): users have roles (admin, viewer); roles have permissions.
- **ABAC** (attribute-based): rules over attributes ("managers can approve expenses under $5k in their department").
- **ReBAC** (relationship-based): permissions follow relationships ("editors of a folder can edit its documents"), like Google Zanzibar.

## Related
[Foundations](#/sd/concept/request-path) · [Caching](#/sd/concept/caching)`
},
{
  id: 'observability', name: 'Reliability, availability and observability',
  body: `## Key terms
- **Availability**: the share of time the system works. "Three nines" (99.9%) ≈ 8.8 hours down per year; "four nines" (99.99%) ≈ 53 minutes.
- **SLA / SLO / SLI**: an **SLI** is a measurement (p99 latency, error rate); an **SLO** is your target for it (p99 < 300 ms); an **SLA** is a promise to customers with penalties.
- **Single point of failure (SPOF)**: a component whose failure takes everything down.
- **Redundancy**: running extra copies so one failure doesn't matter.
- **Availability zone (AZ)**: a separate data center within a cloud region with its own power and network. Spreading servers across AZs survives a data center outage.
- **Failover**: switching to a backup when the primary fails.

## Techniques to make systems resilient
- **No SPOFs**: multiple app servers across AZs, replicated databases, redundant load balancers.
- **Timeouts** on every network call, so one slow dependency doesn't freeze everything.
- **Retries with backoff** and **circuit breakers** (see [Idempotency](#/sd/concept/idempotency)).
- **Bulkheads**: separate resource pools so one overloaded feature can't starve others (named after ship compartments).
- **Rate limiting and load shedding**: reject excess requests early to protect the core.
- **Graceful degradation**: when a non-critical part fails, hide that feature instead of failing the page (no recommendations, but checkout still works).

## Observability: knowing what's happening
- **Metrics**: numbers over time (requests/sec, error rate, latency percentiles, queue lag). Dashboards and alerts are built on these.
- **Logs**: text records of events, ideally structured (JSON) with a **request id** so you can follow one request across services.
- **Traces**: the timeline of one request through every service it touched, showing where time was spent.

## Safe deploys
**Canary** releases (send 1% of traffic to the new version first), **feature flags** (turn code paths on/off without deploying), gradual rollouts and fast rollback.

## Related
[Replication](#/sd/concept/replication) · [Idempotency and retries](#/sd/concept/idempotency) · [Scaling](#/sd/concept/scaling)`
},
{
  id: 'estimation', name: 'Back-of-the-envelope estimation',
  body: `## TL;DR
Quick rough math to check whether a design choice is necessary, e.g. "does this fit on one machine?"

## When to do it
Only when the answer changes a decision. Many interviewers today prefer you skip upfront math and estimate in context: "500 GB of hot data won't fit in one Redis node, so we'll shard the cache."

## The method
1. Start from users: daily active users (DAU) × actions per user per day = actions/day.
2. Divide by ~100,000 (seconds in a day, rounded from 86,400) to get the **average per second**.
3. Multiply by 2–10 for **peak**.
4. For storage: items per day × size × retention days.

**Example:** 100M DAU each viewing 20 pages → 2 billion requests/day ÷ 10⁵ ≈ 20,000 req/s average, ~100,000 at peak. That's many app servers (one handles roughly 1k–10k simple req/s) but reads from a cache can absorb most of it.

## Useful sizes
- 1 KB ≈ a small JSON record; 1 MB ≈ a photo; 1 GB ≈ an hour of compressed video at moderate quality.
- 1 billion × 1 KB = 1 TB.
- A single database server comfortably holds several TB.
- See [Numbers worth knowing](#/sd/guide/numbers) in Start here for latency and capacity numbers.

## Related
[Scaling](#/sd/concept/scaling) · [Foundations](#/sd/concept/request-path)`
}

{ id: 'postgres', name: 'PostgreSQL', body: `## TL;DR
The default relational database. If you're not sure what to pick, pick Postgres and say why.

## What it is
A [relational database](#/sd/concept/databases): tables, rows, SQL, joins. Runs on one main server (the primary), optionally with copies ([replicas](#/sd/concept/replication)).

## Why people reach for it
- Real [transactions](#/sd/concept/databases) (ACID), so money and bookings stay correct.
- \`SELECT … FOR UPDATE\` and unique constraints handle [contention](#/sd/concept/contention).
- Great [indexes](#/sd/concept/indexing): B-tree for normal lookups, GIN for JSON and full-text, PostGIS for maps.
- Stores JSON too (JSONB), so it covers a lot of "NoSQL" use cases.

## How it scales (in this order)
1. Bigger machine ([vertical scaling](#/sd/concept/scaling)). Goes a long way.
2. [Read replicas](#/sd/concept/replication) for read-heavy load.
3. A [cache](#/sd/concept/caching) in front.
4. Partition huge tables (e.g. by month).
5. [Shard](#/sd/concept/sharding) across machines only when writes or size demand it.

## Gotchas
One primary means a write ceiling. Too many connections hurt it, so people put a pooler (PgBouncer) in front.` },
{ id: 'redis', name: 'Redis', body: `## TL;DR
A super-fast in-memory data store. The Swiss Army knife of system design.

## What it is
A key-value store that keeps everything in RAM, so reads and writes take well under a millisecond. Values can be strings, lists, sets, hashes, **sorted sets** (items with scores, kept in order) and geo points.

## What you'll use it for
- [Cache](#/sd/concept/caching) in front of the database.
- Session store for [stateless](#/sd/concept/scaling) app servers.
- [Rate limiter](#/sd/walk/rate-limiter-sd) counters (INCR + EXPIRE).
- Leaderboards (sorted sets).
- [Distributed locks](#/sd/concept/contention) and seat holds with a TTL (\`SET key value NX EX 600\` = set only if missing, auto-expire in 10 min).
- [Pub/sub](#/sd/concept/realtime) to fan real-time messages out to connection servers.
- "Drivers near me" with GEO commands ([search & geo](#/sd/concept/search)).

## Gotchas
RAM is limited and pricey. It can persist to disk, but don't treat it as your source of truth for important data. Very hot single keys can overload one node.` },
{ id: 'kafka', name: 'Kafka', body: `## TL;DR
A durable, replayable log of events that many services can read at their own pace.

## What it is
A distributed [log/stream](#/sd/concept/queues). Producers append events to a **topic** (like "clicks"). Each topic is split into **partitions** so it can spread over many machines. Events stay for days, and each consumer group tracks its own position, so you can replay.

## Why use it
- Absorb huge write spikes (ad clicks, telemetry).
- Decouple services: the order service doesn't need to know who listens for "order placed".
- Rebuild things by replaying history.

## Things to say
- **Partition key**: events with the same key go to the same partition and stay in order (e.g. key by ad_id or chat_id).
- More partitions = more consumers can work in parallel.
- Delivery is at-least-once, so consumers must be [idempotent](#/sd/concept/idempotency).
- Watch **consumer lag** (how far behind readers are).

## Kafka vs a plain queue
A queue (SQS) deletes a message once one worker handles it. Kafka keeps it so several groups can read it. Pick a queue for "do this job", Kafka for "this happened, anyone who cares can react".` },
{ id: 'dynamo', name: 'DynamoDB / Cassandra', body: `## TL;DR
NoSQL [databases](#/sd/concept/databases) that scale writes almost without limit, if you design tables around your queries up front.

## How the data is shaped
- **Partition key**: decides which machine holds the row (they use [consistent hashing](#/sd/concept/consistent-hashing)).
- **Sort key**: orders rows within a partition.
- Example: messages table, partition key = chat_id, sort key = timestamp. "Latest 50 messages in this chat" is one fast read.

## When to pick it
Massive write volume, simple key-based lookups, predictable access patterns (chat messages, events, IoT data).

## Gotchas
- No joins, limited ad-hoc queries. New query pattern = maybe a new index or table.
- [Hot partitions](#/sd/concept/sharding) if one key gets most of the traffic.
- Reads are [eventually consistent](#/sd/concept/consistency) by default (Dynamo lets you pay for strong reads).
- DynamoDB has conditional writes (great for [contention](#/sd/concept/contention)) and TTLs.` },
{ id: 'elastic', name: 'Elasticsearch', body: `## TL;DR
A search engine you put next to your database for text search and filtering.

## What it does
Builds an [inverted index](#/sd/concept/search) (word → documents) so "find events matching 'taylor swift' in NYC next week" is fast, ranked by relevance, and forgiving of typos.

## How it fits
The database stays the source of truth. Changes stream into Elasticsearch via CDC (change data capture), so search is a few seconds behind. That's fine for search, so say so.

## Gotchas
Not a primary database. Reindexing big datasets is slow. Deep pagination is expensive.` },
{ id: 's3cdn', name: 'S3 & CDNs', body: `## TL;DR
S3 holds your files; a CDN delivers them fast from near the user.

## S3 (object storage)
Store any file under a key. Practically unlimited, cheap, extremely durable. Supports **presigned URLs** (temporary permission to upload/download one file directly) and **multipart uploads** (big files in resumable chunks). Details: [Large files](#/sd/concept/blobs).

## CDN
A worldwide network of [cache](#/sd/concept/caching) servers. The first request in a city fetches from your origin; the rest are served locally. Use it for images, video, JS/CSS, even cacheable API responses. Signed URLs keep private content private.` },
{ id: 'gateway', name: 'API gateway & load balancer', body: `## TL;DR
The front door. Usually one box in your diagram.

## Load balancer
Spreads requests across identical servers and skips unhealthy ones. More: [Load balancing](#/sd/concept/load-balancing).

## API gateway
A smarter front door: checks [auth](#/sd/concept/auth) tokens, applies [rate limits](#/sd/walk/rate-limiter-sd), routes \`/bookings\` to the booking service and \`/search\` to search.

## In the interview
Draw "Client → API Gateway → services" and move on, unless the question is about the gateway itself.` },
{ id: 'flink', name: 'Stream processing (Flink)', body: `## TL;DR
Runs continuous calculations on a stream of events as they arrive, e.g. "clicks per ad per minute".

## Key ideas
- Reads from [Kafka](#/sd/tech/kafka), keeps running state (counts so far), writes results out.
- **Windows** group events by time: tumbling (every minute, no overlap), sliding (last 5 minutes, updated every minute), session (until the user goes quiet).
- **Checkpoints** save state regularly so a crash resumes without losing counts.
- **Watermarks** decide how long to wait for late events before closing a window.

## Where it shows up
[Ad click aggregator](#/sd/walk/ad-click-aggregator), fraud detection, real-time dashboards, trending topics.` },
{ id: 'zookeeper', name: 'Coordination (ZooKeeper / etcd)', body: `## TL;DR
Small, strongly consistent stores for "who's in charge?" questions.

## Uses
Leader election (which of 3 servers is primary), shared config, service discovery (which servers are alive), and locks that are actually safe. Kafka and Kubernetes rely on these internally.

## In the interview
Rarely drawn. Mention it if you need leader election or a truly safe [distributed lock](#/sd/concept/contention).` }
];

{ id: 'p-realtime', name: 'Pattern: real-time updates', body: `## TL;DR
Users need to see what others did within a second: chat, live comments, bids, a driver moving on a map.

## The recipe
1. Client keeps an open connection: [SSE or WebSocket](#/sd/concept/realtime).
2. That connection lives on one of many connection servers.
3. When something happens, the writer saves it to the database, then **publishes** it to a channel (per chat, per stream, per user) via [Redis pub/sub or Kafka](#/sd/concept/realtime).
4. Connection servers **subscribed** to that channel push it to their connected clients.

## Deep dives interviewers like
- Huge rooms (1M viewers): batch or sample updates instead of pushing every event.
- Reconnects: client says "last id I saw", server sends what it missed.
- Presence: heartbeats + a Redis key with a short TTL.

## See it used
[Chat](#/sd/walk/chat), [Live comments](#/sd/walk/live-comments), [Uber](#/sd/walk/uber).` },
{ id: 'p-longtasks', name: 'Pattern: long-running tasks', body: `## TL;DR
If work takes more than a couple of seconds, don't make the user wait on the request. Queue it and report back.

## The recipe
1. API validates the request, saves a job row (status: pending), puts the job on a [queue](#/sd/concept/queues), returns "202 Accepted" with a job id.
2. Workers pull jobs, do the work, update the status.
3. Client finds out by polling the job id, or gets pushed an update ([SSE/WebSocket](#/sd/concept/realtime)), or an email.

## Deep dives
Retries + dead-letter queue, [idempotent](#/sd/concept/idempotency) steps, progress %, cancel buttons, separate queues for urgent vs bulk work, autoscaling workers on queue length.

## See it used
[Video transcoding](#/sd/walk/video-streaming), [Notifications](#/sd/walk/notifications), report exports, AI agent runs.` },
{ id: 'p-contention', name: 'Pattern: contention', body: `## TL;DR
Lots of people want the same scarce thing (last seat, limited sneaker drop). Make sure exactly one wins.

## The ladder (start at the top, go down only if needed)
1. Transaction + row lock, or a conditional update ([Contention](#/sd/concept/contention)).
2. Optimistic concurrency with a version number when conflicts are rare.
3. Temporary holds with an expiry for multi-minute checkouts.
4. A virtual waiting room/queue for extreme spikes, letting people in in batches.

## Always say
What's being contended (a seat), what the loser sees, how holds expire.

## See it used
[Ticketmaster](#/sd/walk/ticketmaster), [Uber matching](#/sd/walk/uber), [Payments](#/sd/walk/payments-ledger).` },
{ id: 'p-reads', name: 'Pattern: scaling reads', body: `## TL;DR
Most apps read way more than they write. Make reads cheap.

## Moves, cheapest first
1. Right [indexes](#/sd/concept/indexing) and sane queries.
2. Precompute: store the answer instead of computing it per request (feeds, counters, search indexes).
3. [Cache](#/sd/concept/caching) in Redis and a CDN.
4. [Read replicas](#/sd/concept/replication).
5. [Shard](#/sd/concept/sharding).

## Viral content
One item gets hammered (a hot key): copy it into each app server's memory for a few seconds, or spread it across several cache keys.

## See it used
[News feed](#/sd/walk/news-feed), [URL shortener](#/sd/walk/url-shortener), [Typeahead](#/sd/walk/typeahead).` },
{ id: 'p-writes', name: 'Pattern: scaling writes', body: `## TL;DR
When writes overwhelm one database, spread them out or do fewer of them.

## Moves
- Batch writes together.
- Buffer through a [queue or Kafka](#/sd/concept/queues) to smooth spikes.
- Pre-aggregate: count clicks per minute in memory ([Flink](#/sd/tech/flink)) and write one row, not one row per click.
- [Shard](#/sd/concept/sharding) by a key that spreads load evenly.
- Use a write-optimized store ([Cassandra/Dynamo](#/sd/tech/dynamo)).
- Hot key? Add a random suffix to spread it, combine on read.

## See it used
[Ad click aggregator](#/sd/walk/ad-click-aggregator), [Uber location updates](#/sd/walk/uber).` },
{ id: 'p-blobs', name: 'Pattern: big files', body: `## TL;DR
Bytes go straight between the client and S3. Your servers only handle the metadata.

## The recipe
Presigned URL → direct (multipart, resumable) upload to S3 → S3 event kicks off processing → CDN for downloads. Full explanation: [Large files](#/sd/concept/blobs).

## See it used
[Dropbox](#/sd/walk/dropbox), [YouTube/Netflix](#/sd/walk/video-streaming), chat attachments.` },
{ id: 'p-multistep', name: 'Pattern: multi-step workflows', body: `## TL;DR
A business process spans several services and can take minutes or days (order → pay → ship). Steps can fail halfway.

## Two styles
- **Choreography**: each service listens for events and does its part. Simple to start, hard to see the whole flow.
- **Orchestration**: a workflow engine (Temporal, AWS Step Functions) runs the steps, tracks state, retries and times out. Easier to reason about.

## Sagas
You can't do one database transaction across services. Instead each step has an "undo" (refund the payment, release the seat). If step 3 fails, run the undos for steps 2 and 1.

## See it used
[Payments](#/sd/walk/payments-ledger), [Ticketmaster checkout](#/sd/walk/ticketmaster), AI agents that call several tools.` }

{
  id: 'url-shortener', name: 'URL Shortener', level: 'Warm-up', tags: ['caching', 'ids', 'reads'],
  body: `## 1. Requirements
**Functional**
1. Users create a short URL from a long URL (optional custom alias, optional expiry).
2. Visiting the short URL redirects to the long URL.
Out of scope: analytics dashboards, accounts.

**Non-functional**
- Redirect latency < 100 ms; reads ≫ writes (~100:1 to 1000:1).
- Short codes unique; no collisions.
- Highly available for redirects (eventual consistency OK for new links propagating a few seconds).
- Scale: ~100M new URLs/month, ~1B URLs total.

## 2. Entities
URL { shortCode, longUrl, createdAt, expiresAt, ownerId? }

## 3. API
\`\`\`
POST /urls  { longUrl, alias?, expiresAt? } -> { shortUrl }
GET  /:code -> 302 Location: longUrl
\`\`\`
302 (temporary) instead of 301 if you want every hit to reach you (analytics, expiry). 301 lets browsers cache and saves load.

## 4. High-level design
\`\`\`
Client -> LB -> Write Service -> DB (code -> url)
Client -> LB -> Read Service -> Redis -> DB
\`\`\`
Separate read and write services because their scale differs by 100×+.

## 5. Deep dives
**Generating unique short codes**
- Hash the long URL (MD5/SHA) and take 7 base62 chars: collisions need a check-and-retry; same URL gives same code (maybe desirable).
- **Global counter + base62 encode** (preferred): 62⁷ ≈ 3.5 trillion codes. Redis INCR is atomic; to avoid a hotspot, each write server grabs **batches** of 1,000 ids. Codes are sequential → guessable; if that matters, shuffle with a reversible bijection or add a random salt.
- Custom alias: insert with a unique constraint; conflict → 409.

**Fast redirects**
- Redis cache-aside keyed by code; LRU eviction; 1B × ~500 bytes = ~500 GB total but the hot set is small.
- CDN/edge caching of the redirect responses for the hottest links.

**Scale of storage**
- 1B rows fits in one well-indexed Postgres or DynamoDB table; primary key on shortCode. Shard by code hash if needed.

## Senior-level extras
Expiry via TTL index or lazy check on read + cleanup job; abuse (malware links, rate limit creation per IP/user); analytics through an async click stream (Kafka) rather than in the redirect path.`

{
  id: 'ticketmaster', name: 'Ticketmaster (event booking)', level: 'Core', tags: ['contention', 'consistency', 'search', 'spikes'],
  body: `## 1. Requirements
**Functional**
1. Users view an event (venue, seat map, availability).
2. Users search for events.
3. Users book tickets (select seats → hold → pay → confirmed).

**Non-functional**
- **Strong consistency for booking**: never double-sell a seat.
- High availability for viewing/search (eventual is fine).
- Handle massive spikes for popular on-sales (millions of users in minutes).
- Read-heavy: ~100:1 views to bookings.

## 2. Entities
Event, Venue, Performer, Ticket { id, eventId, seat, price, status: available | reserved | booked, reservedUntil }, Booking { id, userId, ticketIds, status, paymentId }.

## 3. API
\`\`\`
GET  /events/:id               -> Event + Venue + Tickets
GET  /events/search?q=&date=&loc=
POST /bookings/reserve { ticketIds }   -> { bookingId, expiresAt }
PUT  /bookings/confirm { bookingId, paymentDetails }
\`\`\`

## 4. High-level design
\`\`\`
Client -> API Gateway -> Event Service  -> Postgres (events, tickets)
                      -> Search Service -> Elasticsearch (CDC from Postgres)
                      -> Booking Service -> Postgres + Redis (holds)
                                         -> Stripe (payment, webhook back)
\`\`\`
Booking flow: reserve (seats → reserved with 10-min expiry) → user pays via Stripe → webhook confirms → tickets booked.

## 5. Deep dives
**Holding seats during checkout (the core question)**
1. Long DB lock for 10 minutes: bad, holds locks and connections.
2. Status column + \`reservedUntil\` timestamp; reserve with a conditional update \`WHERE status='available' OR reservedUntil < now()\`. Simple and correct; a cron or lazy check releases expired holds.
3. **Redis distributed lock per ticket with TTL** (SET NX EX 600) plus DB status for booked. Auto-expiry; Redis is the hold source of truth, DB is the sale source of truth.
Confirm step uses a DB transaction that checks the ticket is still held by this booking.

**Surviving the on-sale spike**
- **Virtual waiting room**: users enter a queue (Redis sorted set by arrival), admitted in batches; WebSocket/SSE tells them when it's their turn. Protects the booking service and is fairer.
- Cache the event page/seat map aggressively; push availability updates via SSE instead of everyone polling.

**Fast search**
- Elasticsearch fed by CDC; cache popular queries; CDN for static event pages.

**Payments**
- Idempotency key per booking; Stripe webhook updates status; reconcile stuck bookings.

## Senior-level extras
Seat map real-time updates (SSE), bot protection (rate limits, CAPTCHAs at queue entry), per-user ticket limits, and a clear story for the losing user ("seat taken, here are alternatives").`
