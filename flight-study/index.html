{
  id: 'news-feed', name: 'News Feed (Facebook / Instagram style)', level: 'Core', tags: ['fan-out', 'caching', 'pagination'],
  body: `## 1. Requirements
**Functional**
1. Users create posts.
2. Users follow other users.
3. Users view a feed of posts from people they follow, newest first, paginated.

**Non-functional**
- Feed loads < 500 ms; eventual consistency OK (a post can take a minute to appear).
- 1B users; some users have 100M followers.
- Read-heavy.

## 2. Entities
User, Follow { followerId, followeeId }, Post { id, authorId, content, createdAt }, FeedItem.

## 3. API
\`\`\`
POST /posts { content }
PUT  /users/:id/followers   (follow)
GET  /feed?cursor=&limit=   -> { items, nextCursor }
\`\`\`
**Cursor pagination** (by createdAt/id), not offset: new posts at the top would shift offsets.

## 4. High-level design (naive)
Feed read = get followees → query their recent posts → merge/sort. Works for small scale; too slow when you follow 1,000 people.

## 5. Deep dives
**Fan-out on write (push)**: when a post is created, write its id into each follower's precomputed feed (Redis list / feed table). Feed reads are a single fetch. Problem: a celebrity post = 100M writes.

**Fan-out on read (pull)**: compute at read time. Cheap writes, slow reads.

**Hybrid (the answer):** push for normal users (via a queue → fan-out workers); for accounts with > N followers, **don't fan out**; at read time, merge the precomputed feed with recent posts pulled from the celebrities you follow.

**Storage:** posts in DynamoDB/Cassandra (PK authorId, SK createdAt) or sharded Postgres; follows table with indexes both directions; feed cache in Redis capped at ~500 ids per user.

**Hot posts:** cache post bodies separately from feed id lists; like counts updated asynchronously.

## Senior-level extras
Ranking (fetch candidates, then rank with an ML service), inactive users (skip fan-out for users not seen in 30 days, compute on login), deletes/privacy changes (filter at read time), and the client side (prefetch next page, virtualization).`
},
{
  id: 'chat', name: 'Chat App (WhatsApp / Messenger)', level: 'Core', tags: ['websockets', 'real-time', 'delivery'],
  body: `## 1. Requirements
**Functional**
1. 1:1 and group chats (≤ 100 members).
2. Send/receive messages in real time.
3. Offline users receive messages when they reconnect.
4. (Nice) media attachments, read receipts.

**Non-functional**
- Delivery latency < 500 ms when online.
- Guaranteed delivery; messages ordered within a chat.
- Billions of messages/day; many concurrent connections.
- Retain messages on server only as long as needed (WhatsApp-style) or forever (Messenger-style): clarify.

## 2. Entities
User, Chat, ChatParticipant, Message { id, chatId, senderId, body, createdAt }, Client/Device (for per-device delivery).

## 3. Interface (WebSocket messages)
\`\`\`
-> sendMessage { chatId, clientMsgId, body }   <- ack { messageId }
<- newMessage { chatId, message }               -> ack { messageId }
-> createChat / modifyParticipants (REST is fine)
\`\`\`

## 4. High-level design
\`\`\`
Client <-WS-> Chat Server(s) -> DB (messages, chats)
                 |  publish/subscribe
                 v
              Redis Pub/Sub (channel per user)
\`\`\`
Send flow: persist message → write per-recipient "inbox" rows (undelivered) → publish to each recipient's channel → the server holding that recipient's socket pushes it → client acks → remove from inbox.

## 5. Deep dives
**Routing across servers:** each chat server subscribes to the user channels for connected users (Redis pub/sub is at-most-once, so the inbox table is the durability backstop). Alternative: a user→server registry and direct server-to-server calls.

**Offline delivery:** on reconnect, client fetches undelivered inbox items (or messages since its last seen id). Push notifications (APNs/FCM) for offline mobile users.

**Ordering:** per-chat sequence numbers or server timestamps + message id tie-break; client sorts. Idempotency with clientMsgId so retries don't duplicate.

**Storage:** Cassandra/DynamoDB with PK chatId, SK messageId (time-sortable, e.g. Snowflake ids) → "latest 50" is one partition query.

**Media:** presigned upload to S3, send a message containing the reference.

## Senior-level extras
Multi-device (inbox per device), E2E encryption implications (server can't read content; key exchange per device), presence with heartbeats and TTL, reconnect storms after a deploy (jittered backoff), connection-server draining.`
},
{
  id: 'rate-limiter-sd', name: 'Distributed Rate Limiter', level: 'Core', tags: ['redis', 'algorithms', 'gateway'],
  body: `## 1. Requirements
**Functional**
1. Limit requests per client (user id, API key or IP) per rule (e.g. 100 req/min).
2. Return 429 with headers (X-RateLimit-Remaining, Retry-After) when limited.
3. Configurable rules per endpoint/tier.

**Non-functional**
- Adds < 10 ms latency.
- Works across many API servers (shared state).
- Highly available: if the limiter is down, **fail open** (usually) to protect availability.
- 1M req/s across the fleet.

## 2. Where it lives
API gateway / middleware, before business logic. Client-side limits are hints only.

## 3. Algorithms (know trade-offs)
| Algorithm | State | Pros | Cons |
|---|---|---|---|
| Fixed window counter | 1 counter/window | Simple, cheap | 2× burst at window edges |
| Sliding window log | timestamps | Exact | Memory heavy |
| Sliding window counter | 2 counters | Smooth, cheap | Approximate |
| **Token bucket** | tokens + last refill | Allows bursts, O(1), common | Tuning two params |
| Leaky bucket | queue | Smooth output | Adds latency |

Token bucket math: \`tokens = min(cap, tokens + (now - last) * rate)\`; if tokens ≥ 1 → allow and decrement.

## 4. High-level design
\`\`\`
Client -> Gateway (rate limit middleware) -> Services

**Non-functional**
- Politeness: respect robots.txt and per-domain rate limits.

\`\`\`
Frontier queue (Kafka/SQS) -> Fetcher workers -> DNS cache -> fetch HTML
   -> store raw HTML in S3 -> Parser queue -> Parser workers
   -> extract text (S3) + links -> URL filter/dedupe -> back to Frontier
Metadata DB: url, lastCrawled, contentHash, status
\`\`\`
Separate fetch and parse stages so they scale independently and a parse failure doesn't refetch.

## 3. Deep dives
**Politeness:** per-domain queues/rate limits (e.g. 1 req/s per domain), robots.txt cached per domain with crawl-delay; a scheduler hands out URLs only when a domain's next-allowed time has passed.

**Fault tolerance:** URLs only acked after success; retries with backoff; DLQ after N failures.

**Crawler traps:** max depth, max pages per domain, URL length limits.

**Throughput math:** 25k pages/s × ~2 MB = 50 GB/s of network across the fleet → hundreds of fetchers; DNS caching matters.`

## 1. Requirements
**Functional**
1. Users sign up and log in on web and mobile (password + MFA, passkeys).
2. Authenticated sessions across services; logout and "log out everywhere".
3. Third parties / internal services access APIs with scoped tokens (OAuth).

**Non-functional**
- Security first: phishing resistance, revocation within seconds for sensitive actions, audit trail.
- Low latency token checks on every API call (< 5 ms).
- High availability: auth down = product down.

## 2. Entities
User, Credential (password hash | WebAuthn public key | TOTP secret), Session { id, userId, deviceInfo, createdAt, lastSeen, revokedAt }, RefreshToken (rotating, hashed), OAuthClient, Grant/Consent, AuditEvent.

## 3. API
\`\`\`
POST /auth/login           { email, password } -> MFA challenge | session
POST /auth/mfa/verify      { challengeId, code }
POST /auth/webauthn/options  / /auth/webauthn/verify
POST /auth/token/refresh   (refresh token in httpOnly cookie)
POST /auth/logout          | POST /auth/sessions/revoke-all
GET  /oauth/authorize  POST /oauth/token  (Authorization Code + PKCE)
\`\`\`

## 4. High-level design
\`\`\`
Clients -> API Gateway (verify access token signature, rate limit)
        -> Auth Service -> Postgres (users, credentials, sessions)
                        -> Redis (session cache, revocation list, rate limits)
                        -> KMS/HSM (signing keys, rotated; JWKS endpoint)
        -> Product services (check scopes/permissions)
Audit events -> Kafka -> audit store
\`\`\`

## 5. Deep dives
**Token strategy:** short-lived JWT access tokens (~5–15 min) verified locally by the gateway (fast); refresh tokens are opaque, stored hashed, **rotated** on every use with reuse detection (a reused refresh token = theft → revoke the whole family).

**Revocation:** "log out everywhere" revokes sessions/refresh tokens immediately; access tokens die at expiry, or for sensitive endpoints check a Redis revocation set by session id (accept the extra lookup there only).

**Web vs mobile:** web uses httpOnly Secure SameSite cookies (no tokens in localStorage → XSS can't steal them) + CSRF protection; mobile stores refresh tokens in Keychain/Keystore.

**Passkeys:** WebAuthn registration stores a public key per device; login signs a server challenge; origin-bound so phishing sites can't use it. Keep account recovery strong (it becomes the weakest link).

**Brute force:** rate limit per account and per IP, progressive delays, breached-password checks, step-up auth for risky actions (new device, money movement).

**Key management:** signing keys in KMS, published as JWKS with key ids; rotate with overlap.

## 1. Requirements
**Functional**
1. Users deposit/withdraw money and transfer between accounts.
2. Show accurate balances and transaction history.
3. Integrate with external rails (ACH, cards via a processor).

**Non-functional**
- **Never lose or duplicate money**; strong consistency for balances.
- Full audit trail; immutable history.
- Exactly-once effects in the face of retries.

## 2. Core idea: double-entry ledger
Every transaction is a set of **entries** that sum to zero: debit one account, credit another. Balances are derived (sum of entries) and cached, never edited directly. Entries are append-only; mistakes are fixed with reversing entries.
\`\`\`
Transaction { id, idempotencyKey, status, createdAt }
Entry { txId, accountId, amount (+/-), currency }
Account { id, type, cachedBalance, version }
\`\`\`

## 3. Design
\`\`\`
Client -> Payments API (idempotency key required)
   -> Payment Service (state machine: created -> pending -> settled | failed)
   -> Ledger Service -> Postgres (single transaction writes all entries
                        + updates cached balances with version check)
   -> External processor (ACH/card) via outbox + workers
   <- webhooks -> update state -> ledger entries
Reconciliation job: compare ledger vs processor/bank reports daily
\`\`\`

## 4. Deep dives
**Idempotency:** unique (client, idempotencyKey); store the response; retries return it.
**Atomicity:** all entries of a transaction in one DB transaction; balance check with \`SELECT … FOR UPDATE\` or optimistic version to prevent overdraft races.
**External calls:** never inside the DB transaction. Use the **outbox pattern** and a state machine; processors are slow and can fail ambiguously (timeout ≠ failure) → query status before retrying.
**Reconciliation:** daily automated diff with external statements; alerts on mismatch. This is how real fintechs sleep at night.
**Money types:** integers in minor units (cents) or decimal types; never floats.

## Senior-level extras
Holds/authorizations vs settlement, multi-currency, regulatory audit (who changed what), sharding ledger by account with care for cross-shard transfers (saga with compensations).`

  body: `## Requirements
Conversation list + message thread, real-time incoming messages, sending with delivery states (sending, sent, failed), unread counts, history scroll-back, works on flaky mobile networks.

## Architecture
\`\`\`
<ChatApp>
  ConnectionManager (single WebSocket, reconnect w/ backoff + jitter, heartbeat)
  Store: conversations{id}, messages{conversationId: ordered ids}, pendingOutbox
  <ConversationList/>  sorted by lastMessageAt, unread badges
  <Thread/>            reverse infinite scroll, virtualized
  <Composer/>
\`\`\`

## Sending
Generate a **clientMsgId**, insert optimistically as "sending", put in an outbox (persist in IndexedDB for offline), send over socket; on ack replace with server id and mark "sent"; on timeout retry; after N failures mark "failed" with tap-to-retry. Server dedupes by clientMsgId.

## Receiving & ordering
Insert by server timestamp/sequence; dedupe by id. On reconnect, fetch messages since the last seen sequence to fill gaps.

## Scroll behavior
Stick to bottom only if the user is already near the bottom; otherwise show "new messages ↓" pill. Loading older messages must preserve scroll position (measure height before/after prepend).

## Other concerns
Typing indicators (throttled), read receipts (send when message is visible), notifications when tab hidden (Notifications API, title badge), media upload via presigned URL with progress, sanitize message content, a11y: live region for incoming messages in the active thread.`
}

| Structure | Access | Search | Insert | Delete |
|---|---|---|---|---|
| Array | O(1) | O(n) | O(n) (end: O(1)) | O(n) |
| Hash map / set | n/a | O(1) | O(1) | O(1) |
| Linked list | O(n) | O(n) | O(1) (*) | O(1) (*) |
| Stack / queue | | | O(1) | O(1) |
| Binary heap | peek O(1) | O(n) | O(log n) | pop O(log n) |
| Balanced BST | O(log n) | O(log n) | O(log n) | O(log n) |
| Trie | | O(L) | O(L) | O(L) |
(*) given a pointer to the node

## Algorithms
| Algorithm | Time | Space |
|---|---|---|
| Sort (JS uses TimSort) | O(n log n) | O(n) |
| Binary search | O(log n) | O(1) |
| BFS / DFS | O(V + E) | O(V) |
| Dijkstra (heap) | O(E log V) | O(V) |
| Topological sort | O(V + E) | O(V) |
| Union-Find op | ~O(1) amortized | O(n) |
| Subsets | O(n·2ⁿ) | O(n) |
| Permutations | O(n·n!) | O(n) |

|---|---|
| ≤ 20 | O(2ⁿ), backtracking |
| ≤ 500 | O(n³) |

{ id: 'howto', name: 'How to run a coding interview', body: `## The flow (35–45 min)
1. **Restate & clarify (2–3 min).** Input sizes, types, duplicates, negatives, empty input, sorted? Return format? Ask for an example if none.
2. **Examples (1–2 min).** Walk one normal case and one edge case by hand.
3. **Brute force out loud (1 min).** State it and its complexity. It shows you can always deliver something.
4. **Optimize (3–5 min).** Name the bottleneck, then the pattern that removes it. Get a nod before coding.
5. **Code (15 min).** Clear names, small helpers, talk while typing.
6. **Test (5 min).** Trace your example line by line, then edge cases. Fix bugs calmly.
7. **Complexity + follow-ups.** Time and space, and what you'd change at scale.

## When you're stuck
- Write the brute force anyway.
- Try a smaller input by hand and look at what you're doing mentally.
- Run the pattern checklist: sort it? hash it? two pointers? window? heap? BFS/DFS? binary search on answer? DP?
- Ask: "Would it help to think about it as a graph?" Interviewers often give a hint if you show your reasoning.

## Phrases
- "Let me make sure I understand the constraints…"
- "The brute force is O(n²) because… the repeated work is…, so a hash map can remove it."
- "I'll write this assuming valid input and then add checks."
- "Let me trace through with [2,7,11] to verify."

## JS interview hygiene
\`const\`/\`let\`, never \`var\`; \`Map\`/\`Set\`; \`Array.from({length: n}, () => [])\` for 2D arrays (not \`fill([])\`, which shares one array!); \`(a, b) => a - b\` in sort; \`Math.trunc\` for int division toward zero; \`arr.at(-1)\` for the last element.` },

{ id: 'bigo', name: 'Big-O, explained simply', icon: 'O', body: `## TL;DR
Big-O describes **how the work grows as the input grows**. It's not about seconds; it's about the shape of the growth.

## The common ones, from fast to slow
| Big-O | Name | Double the input → | Example |
|---|---|---|---|
| O(1) | constant | same work | read \`arr[5]\`, Map lookup |
| O(log n) | logarithmic | one extra step | [binary search](#/pattern/binary-search) |
| O(n) | linear | double the work | one loop over the array |
| O(n log n) | "n log n" | a bit more than double | sorting |
| O(n²) | quadratic | 4× the work | loop inside a loop over the same array |
| O(2ⁿ) | exponential | squares it (roughly) | all subsets ([backtracking](#/pattern/backtracking)) |

## How to figure it out
- One loop over n items → O(n).
- A loop inside a loop → O(n²) (or O(n·m) for two different sizes).
- Halving the problem each step → O(log n).
- Drop constants and smaller terms: O(2n + 5) is just O(n). Big-O is about the trend.

## Space complexity
Same idea for memory. A new array of size n is O(n) space. A few variables is O(1). Recursion uses stack space: O(depth).

## Amortized
Sometimes one operation is slow but rare. \`arr.push\` is usually instant, but occasionally the array has to grow and copy itself. Averaged over many pushes it's still O(1): that's "amortized O(1)".

## In the interview
Always say both: "This is O(n) time and O(n) space because of the hash map." Then mention if a trade is possible ("we could sort instead for O(1) extra space but O(n log n) time").

More: [Big-O cheat sheet](#/more/bigo).` },
{ id: 'ds', name: 'Data structures 101', icon: '[]', body: `## TL;DR
Each data structure makes some operations cheap and others expensive. Picking the right one is half of most problems.

## Array
Items in a row. Grab any item by position instantly (O(1)). Adding/removing at the end is cheap; in the middle is O(n) because everything shifts. JS: \`[]\`.

## Hash map (and set)
Look up a value by key in O(1) on average. Under the hood, a [hash function](#/sd/concept/consistent-hashing) turns the key into a slot number. JS: \`new Map()\`, \`new Set()\` (a set is a map with only keys). Use whenever you think "have I seen this?" or "count these". Pattern: [Arrays & Hashing](#/pattern/hashing).

## Stack
Last in, first out, like a stack of plates. \`push\` and \`pop\` from the top, O(1). JS: an array with push/pop. Use for nesting (brackets), undo, and the [monotonic stack](#/pattern/stack) trick.

## Queue
First in, first out, like a line at a store. JS has no real queue: \`shift()\` is O(n), so use a head index or swap arrays. Use for [BFS](#/pattern/tree-bfs).

## Linked list
Nodes, each holding a value and a pointer to the next node. Inserting/removing next to a node you already have is O(1); finding the 50th item is O(n). Shows up in interviews more than real JS code. Pattern: [Linked lists](#/pattern/linked-list).

## Tree
Nodes with children, starting from a single **root**. A **binary tree** has at most 2 children per node (left, right). **Leaves** have no children. **Depth/height** = number of levels. Patterns: [DFS](#/pattern/tree-dfs), [BFS](#/pattern/tree-bfs).

## Binary search tree (BST)
A binary tree with a rule: everything in a node's left subtree is smaller, everything on the right is bigger. Searching is like binary search: O(log n) if the tree is balanced, O(n) if it's lopsided.

## Heap
A tree (stored in an array) that always keeps the smallest item (min-heap) or largest (max-heap) on top. Peek O(1), push/pop O(log n). Use for "top k" and "always grab the next best". JS doesn't have one built in. Pattern: [Heaps](#/pattern/heap).

## Graph
Things (nodes/vertices) connected by relationships (edges). Edges can be one-way (directed) or two-way, and can have weights (distances, costs). Usually stored as an **adjacency list**: a map from each node to its neighbors. Trees are a special kind of graph. Pattern: [Graphs](#/pattern/graphs).

## Trie
A tree where each step is one character, so all words sharing a prefix share a path. Fast prefix lookups for autocomplete. Pattern: [Tries](#/pattern/trie).

## Quick picker
| You need… | Use |
|---|---|
| "Seen it?" / counting | Map / Set |
| Most recent unmatched thing | Stack |
| Process in arrival order / shortest steps | Queue (BFS) |
| Repeatedly the smallest/largest | Heap |
| Sorted order + fast search | Sorted array + binary search, or BST |
| Relationships / networks | Graph |
| Prefix matching | Trie |` },
{ id: 'recursion', name: 'Recursion, explained simply', icon: '↻', body: `## TL;DR
A recursive function solves a problem by calling itself on a **smaller** version of the same problem, until it hits a version so small the answer is obvious (the **base case**).

## The two parts
\`\`\`js
function sum(arr, i = 0) {
  if (i === arr.length) return 0;        // base case: nothing left
  return arr[i] + sum(arr, i + 1);       // recursive case: smaller problem
}
\`\`\`
1. **Base case**: when to stop. Forget it and you recurse forever (stack overflow).
2. **Recursive case**: do a little work, trust the recursive call to handle the rest.

## The "trust" mindset
Don't trace every call in your head. Assume the recursive call returns the right answer for the smaller input, then ask: "given that, how do I build my answer?" That's exactly how tree problems work: "assume I know the height of each child; my height is 1 + the bigger one." See [Trees: DFS](#/pattern/tree-dfs).

## The call stack
Each call waits for the one it made to finish. Those waiting calls pile up on the **call stack**. Depth 10,000 can overflow in JS (\`RangeError: Maximum call stack size exceeded\`). Fix: rewrite with your own stack/loop.

## Recursion → memoization → DP
Some recursions solve the same subproblem many times (Fibonacci). Store answers in a map the first time (**memoization**) and you've basically got [dynamic programming](#/pattern/dp-1d).

## Where it shows up
Trees, graphs ([DFS](#/pattern/graphs)), [backtracking](#/pattern/backtracking), divide and conquer (merge sort), DP.` },

    while (i < lines.length && lines[i].trim() && !/^(```|#|\||\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) buf.push(lines[i++]);
    out += '<p>' + inline(buf.join(' ')) + '</p>';
  }
  return out;
}

// ---------- runner (web worker) ----------
let worker = null, pending = null;
function getWorker() {
  if (worker) return worker;
  const src = RUNTIME_SRC + '\nself.onmessage = async e => { const d = e.data; const logs = []; const fmt = a => a.map(x => typeof x === "string" ? x : __fmt(x)).join(" "); console.log = (...a) => { if (logs.length < 200) logs.push(fmt(a)); }; console.error = console.warn = console.log; const r = await __runTests(d.code, d.fn, d.tests, d.harness, d.cmp); r.logs = logs; self.postMessage(r); };';
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  return worker;
}
function runCode(p, code) {
  return new Promise(resolve => {
    const w = getWorker();
    const timer = setTimeout(() => { w.terminate(); worker = null; resolve({ error: 'Timed out after 5 s. Infinite loop or very slow solution?', results: [] }); }, 5000);
    w.onmessage = e => { clearTimeout(timer); resolve(e.data); };
    w.onerror = e => { clearTimeout(timer); w.terminate(); worker = null; resolve({ error: e.message || 'Worker error', results: [] }); };
    w.postMessage({ code, fn: p.fn, tests: p.tests, harness: p.harness, cmp: p.cmp });
  });
}

// ---------- glossary: tap-to-define ----------
const G = GLOSSARY.map(([term, aliases, def, link], i) => ({ i, term, aliases, def, link }));
const aliasMap = new Map();
const pats = [];
G.forEach(g => g.aliases.concat([g.term]).forEach(a => {
  const forms = /[A-Z]/.test(a) ? [a] : [a, a[0].toUpperCase() + a.slice(1)];
  forms.forEach(f => { if (!aliasMap.has(f)) { aliasMap.set(f, g); pats.push(f); } });
}));
pats.sort((a, b) => b.length - a.length);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
const termRe = new RegExp('(?<![\\w-])(' + pats.map(reEsc).join('|') + ')(?![\\w-])', 'g');
function linkTerms(root, used) {
  const here = location.hash;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('a,code,pre,h1,h2,h3,h4,button,.term,.k,summary') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue; termRe.lastIndex = 0;
    let m, last = 0, frag = null;
    while ((m = termRe.exec(text))) {
      const g = aliasMap.get(m[1]);
      if (!g || used.has(g.i) || (g.link && (here === g.link || here.startsWith(g.link + '/')))) continue;
      used.add(g.i);
      frag = frag || document.createDocumentFragment();
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const b = document.createElement('button'); b.className = 'term'; b.dataset.g = g.i; b.textContent = m[1];
      frag.appendChild(b); last = m.index + m[1].length;
    }
    if (frag) { frag.appendChild(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(frag, node); }
  }
}
function showTerm(i) {

  sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('[data-close]') || e.target.closest('a')) close(); });
}

      (shown < p.hints.length ? `<button class="btn wide" id="more">Show hint ${shown + 1} of ${p.hints.length}</button>` : `<button class="btn wide ghost" id="tocode">Back to code</button>`);
    const more = $('#more'); if (more) more.onclick = () => { S.hints = S.hints || {}; S.hints[id] = shown + 1; save(); viewProblem(id, 'hints'); };
    const tc = $('#tocode'); if (tc) tc.onclick = () => { history.replaceState(null, '', '#/problem/' + id + '/code'); viewProblem(id, 'code'); };
  } else {
    const open = S.solved[id] || (S.peek && S.peek[id]);
    if (!open) {
      body.innerHTML = `<div class="card center"><p>Seeing the answer early is fine, but try explaining the approach out loud first.</p><button class="btn" id="reveal">Reveal solution</button></div>`;
      $('#reveal').onclick = () => { S.peek = S.peek || {}; S.peek[id] = 1; save(); viewProblem(id, 'sol'); };
    } else {
      body.innerHTML = `<pre class="code"><code>${esc(p.sol)}</code></pre><article class="prose">${md(p.why)}</article>
      <button class="btn wide ghost" id="load">Load solution into editor</button>`;
      $('#load').onclick = () => { if (confirm('Replace your code with the reference solution?')) { S.code[id] = p.sol; save(); history.replaceState(null, '', '#/problem/' + id + '/code'); viewProblem(id, 'code'); } };
    }
  }
}

function viewDesign() {
  setTitle('System Design', null); tabActive('design');
  app.innerHTML = `<p class="lede">Start with the framework, then do one walkthrough at a time: read the requirements, pause, sketch your own design, then read on.</p>` +
    SD_SECTIONS.map(s => `<h2 class="sec">${esc(s.title)}</h2><div class="list">${s.items.map(it =>
      `<a class="row" href="#/sd/${s.key}/${it.id}"><div><div class="t">${esc(it.name)} ${S.read[s.key + ':' + it.id] ? '<em class="ok">✓</em>' : ''}</div>${it.tags ? `<div class="s">${it.tags.map(esc).join(' · ')}</div>` : ''}</div><i>›</i></a>`).join('')}</div>`).join('');
}

const TAG2 = { caching: ['concept', 'caching'], ids: ['concept', 'databases'], reads: ['pattern', 'p-reads'], contention: ['pattern', 'p-contention'], consistency: ['concept', 'consistency'], search: ['concept', 'search'], spikes: ['concept', 'queues'], 'fan-out': ['pattern', 'p-reads'], pagination: ['concept', 'databases'], websockets: ['concept', 'realtime'], 'real-time': ['pattern', 'p-realtime'], delivery: ['concept', 'idempotency'], redis: ['tech', 'redis'], algorithms: ['concept', 'scaling'], gateway: ['tech', 'gateway'], streaming: ['tech', 'flink'], kafka: ['tech', 'kafka'], flink: ['tech', 'flink'], olap: ['pattern', 'p-writes'], sse: ['concept', 'realtime'], geo: ['concept', 'search'], blobs: ['concept', 'blobs'], sync: ['pattern', 'p-blobs'], presigned: ['concept', 'blobs'], cdn: ['tech', 's3cdn'], transcoding: ['pattern', 'p-longtasks'], queues: ['concept', 'queues'], idempotency: ['concept', 'idempotency'], trie: ['pattern-dsa', 'trie'], frontend: ['guide', 'frontend-framework'], politeness: ['concept', 'queues'], dedupe: ['concept', 'idempotency'], auth: ['concept', 'auth'], security: ['concept', 'auth'], sagas: ['pattern', 'p-multistep'], llm: ['pattern', 'p-longtasks'], retrieval: ['concept', 'search'], evals: ['concept', 'observability'], virtualization: ['guide', 'frontend-framework'], optimistic: ['guide', 'frontend-framework'], debounce: ['pattern-dsa', 'practical'], a11y: ['guide', 'frontend-framework'], offline: ['concept', 'idempotency'], ordering: ['concept', 'queues'] };
function relatedFor(it) {
  const seen = new Set(), out = [];
  (it.tags || []).forEach(t => { const r = TAG2[t]; if (!r) return; const href = r[0] === 'pattern-dsa' ? '#/pattern/' + r[1] : '#/sd/' + r[0] + '/' + r[1]; if (seen.has(href)) return; seen.add(href);
    const item = r[0] === 'pattern-dsa' ? patById[r[1]] : sdFind(r[0], r[1]); if (item) out.push(`<a class="row" href="${href}"><div><div class="t">${esc(item.name)}</div></div><i>›</i></a>`); });
  return out.length ? `<h2 class="sec">Brush up on the concepts used here</h2><div class="list">${out.join('')}</div>` : '';
}
function viewSD(kind, id) {
  const it = sdFind(kind, id); if (!it) return viewDesign();
  setTitle(it.name, '#/design'); tabActive('design');
  const k = kind + ':' + id;
  const isWalk = kind === 'walk' || kind === 'fe';
  app.innerHTML = (isWalk ? `<div class="card"><div class="k">Practice mode</div><p>Read the requirements, then stop and sketch your own entities, API and high-level design (paper, notes app or your head) before reading further.</p></div>` : '') +
    `<article class="prose">${md(it.body)}</article>${isWalk ? relatedFor(it) : ''}
    <button class="btn wide ${S.read[k] ? 'ghost' : ''}" id="markread">${S.read[k] ? '✓ Marked as read' : 'Mark as read'}</button>`;
  $('#markread').onclick = () => { if (S.read[k]) delete S.read[k]; else S.read[k] = Date.now(); save(); viewSD(kind, id); };
}

function viewDrill() {
  setTitle('Drill', null); tabActive('drill');
  const known = CARDS.filter((c, i) => S.known[i]).length;
  app.innerHTML = `<p class="lede">Low-effort, high-value practice for when you're too tired to code.</p>
  <a class="card link" href="#/drill/patterns"><div class="k">🎯 Pattern drill</div><div class="t">Which pattern solves this?</div><div class="s">Read a problem, pick the pattern. Score: ${S.drill.right}/${S.drill.total}</div></a>
  <a class="card link" href="#/drill/cards"><div class="k">🃏 Flashcards</div><div class="t">${CARDS.length} cards: DSA, JS, system design, frontend</div><div class="s">${known} marked as known</div></a>
  <h2 class="sec">Cheat sheets</h2>
  <div class="list"><a class="row" href="#/glossary"><div><div class="t">📖 Glossary</div><div class="s">${G.length} terms in plain English</div></div><i>›</i></a>${CHEATS.map(c => `<a class="row" href="#/more/${c.id}"><div><div class="t">${esc(c.name)}</div></div><i>›</i></a>`).join('')}
  <a class="row" href="#/settings"><div><div class="t">Settings & progress</div><div class="s">Reset progress, offline status</div></div><i>›</i></a></div>`;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function viewPatternDrill() {
  setTitle('Pattern drill', '#/drill'); tabActive('drill');
  const p = P[Math.floor(Math.random() * P.length)];
  const wrong = shuffle(PAT.filter(x => x.id !== p.p)).slice(0, 3);
  const opts = shuffle([patById[p.p], ...wrong]);
  const promptText = p.prompt.split('\n\n')[0];
  app.innerHTML = `<div class="card"><div class="k">${esc(p.t)} · ${DIFF[p.d]}</div><div class="prose">${md(promptText)}</div></div>
  <div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.icon)} ${esc(o.name)}</button>`).join('')}</div>
  <div id="fb"></div>
  <p class="s center">Score: ${S.drill.right}/${S.drill.total}</p>`;
  $('.opts').onclick = e => {
    const b = e.target.closest('.opt'); if (!b || $('.opts').dataset.done) return;
    $('.opts').dataset.done = 1;
    const right = b.dataset.id === p.p;
    S.drill.total++; if (right) S.drill.right++; save();
    document.querySelectorAll('.opt').forEach(x => { if (x.dataset.id === p.p) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
    $('#fb').innerHTML = `<div class="card ${right ? 'good' : 'bad'}"><b>${right ? 'Correct.' : 'Not quite: ' + esc(patById[p.p].name) + '.'}</b><div class="prose">${md(p.hints[0])}</div></div>
      <div class="edbtns"><button class="btn" id="nextq">Next ›</button><a class="btn ghost" href="#/problem/${p.id}">Open problem</a></div>`;
    $('#nextq').onclick = viewPatternDrill;
  };
}

let cardCat = 'all', cardQueue = [], cardPos = 0;
function buildCardQueue() {
  const idx = CARDS.map((c, i) => i).filter(i => cardCat === 'all' || CARDS[i][0] === cardCat);
  const unknown = idx.filter(i => !S.known[i]), knownL = idx.filter(i => S.known[i]);
  cardQueue = shuffle(unknown).concat(shuffle(knownL)); cardPos = 0;
}
function viewCards() {
  setTitle('Flashcards', '#/drill'); tabActive('drill');
  if (!cardQueue.length) buildCardQueue();
  const i = cardQueue[cardPos % cardQueue.length];
  const c = CARDS[i];
  const cats = [['all', 'All'], ['dsa', 'DSA'], ['js', 'JS'], ['sd', 'System design'], ['fe', 'Frontend']];
  app.innerHTML = `<div class="chips" id="cc">${cats.map(([k, l]) => `<button class="chip ${cardCat === k ? 'on' : ''}" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="flash" id="flash"><div class="k">${esc(c[0].toUpperCase())} · ${cardPos % cardQueue.length + 1}/${cardQueue.length} ${S.known[i] ? '· known' : ''}</div><div class="q">${inline(c[1])}</div><div class="a" hidden>${inline(c[2])}</div><div class="tap">Tap to flip</div></div>
  <div class="edbtns"><button class="btn ghost" id="again">Again</button><button class="btn" id="gotit">Got it ✓</button></div>`;
  $('#cc').onclick = e => { const b = e.target.closest('button'); if (!b) return; cardCat = b.dataset.k; buildCardQueue(); viewCards(); };
  $('#flash').onclick = () => { const a = $('#flash .a'); a.hidden = !a.hidden; $('#flash .tap').hidden = !a.hidden; };
  const adv = () => { cardPos++; if (cardPos >= cardQueue.length) buildCardQueue(); viewCards(); };
  $('#again').onclick = () => { delete S.known[i]; save(); adv(); };
  $('#gotit').onclick = () => { S.known[i] = 1; save(); adv(); };
}

function viewCheat(id) {
  const c = CHEATS.find(x => x.id === id); if (!c) return viewDrill();
  setTitle(c.name, '#/drill'); tabActive('drill');
  app.innerHTML = `<article class="prose">${md(c.body)}</article>`;
}

function viewSettings() {
  setTitle('Settings', '#/drill'); tabActive('drill');
  app.innerHTML = `<div class="card"><div class="k">Offline</div><div id="offline" class="pill">Checking…</div>
    <p class="s">Version ${APP_VERSION}. Everything (content, code runner) is stored on this phone once loaded.</p>
    <button class="btn ghost" id="upd">Check for an update (needs internet)</button></div>
  <div class="card"><div class="k">Progress</div><p>${countSolved(P)} problems solved, ${Object.keys(S.read).length} pages read, ${Object.keys(S.known).length} cards known.</p>
    <button class="btn danger" id="wipe">Reset all progress</button></div>`;
  updateOfflinePill();
  $('#upd').onclick = async () => {
    if (!('serviceWorker' in navigator)) return alert('Offline mode is not supported in this browser.');
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) { try { await reg.update(); alert('Checked. If there was an update it will apply next time you open the app.'); } catch (e) { alert('Could not reach the server (offline?). Your current version keeps working.'); } }
  };
  $('#wipe').onclick = () => { if (confirm('Erase all progress and saved code on this phone?')) { S = { solved: {}, attempted: {}, code: {}, star: {}, read: {}, known: {}, last: null, drill: { right: 0, total: 0 } }; save(); viewSettings(); } };
}

async function updateOfflinePill() {
  const el = $('#offline'); if (!el) return;
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') { el.textContent = 'Opened as a file: works now, but install from the link for offline use'; el.className = 'pill warn'; return; }
  try {
    const keys = await caches.keys();
    let ok = false;
    for (const k of keys) { const c = await caches.open(k); if (await c.match('./index.html') || await c.match('./')) ok = true; }
    if (ok) { el.textContent = '✓ Saved for offline use'; el.className = 'pill good'; }
    else { el.textContent = 'Saving for offline… keep this open for a few seconds'; el.className = 'pill warn'; setTimeout(updateOfflinePill, 1500); }
  } catch (e) { el.textContent = 'Offline status unknown'; el.className = 'pill warn'; }
}

// ---------- router ----------
function route() { routeInner(); }
function routeInner() {
  const h = location.hash.replace(/^#\/?/, '');
  const [a, b, c] = h.split('/');
  window.scrollTo(0, 0);
  if (!a) return viewHome();
  if (a === 'patterns') return viewPatterns();
  if (a === 'pattern') return viewPattern(b);
  if (a === 'problems') return viewProblems();
  if (a === 'problem') return viewProblem(b, c);
  if (a === 'design') return viewDesign();
  if (a === 'sd') return viewSD(b, c);
  if (a === 'drill' && b === 'patterns') return viewPatternDrill();
  if (a === 'drill' && b === 'cards') return viewCards();
  if (a === 'drill') return viewDrill();
  if (a === 'more') return viewCheat(b);
  if (a === 'settings') return viewSettings();
  if (a === 'learn') return viewLearn(b);
  if (a === 'glossary') return viewGlossary();
  viewHome();
}
window.addEventListener('hashchange', route);
route();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(updateOfflinePill).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || document.querySelector('.update-bar')) return;
    const bar = document.createElement('button'); bar.className = 'update-bar'; bar.textContent = 'New version downloaded. Tap to reload.';
    bar.onclick = () => location.reload(); document.body.appendChild(bar);
  });
}
})();

</script>
</body>
</html>
